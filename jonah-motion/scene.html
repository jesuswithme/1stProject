<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script>
// 요나 — 욥바 항구 (긴장감 있는 대화 모션그래픽)
// 대사 시작: 나레이션 3.0 / 여 8.2 / 요나 12.0 / 여 17.3 / 요나 20.8 / 여 25.8 / 요나 31.8
// 천둥·임팩트: 0.6, 15.3, 28.65, 37.0   뱃고동 29.9–31.5
const W = 1920, H = 1080, FPS = 30, DUR = TL.dur;
const ctx = document.getElementById('c').getContext('2d');
const TAU = Math.PI * 2;
const FONT = '"WenQuanYi Zen Hei", sans-serif';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const ein = x => x * x * x;
const env = (t, a, b, fi = .25, fo = .25) => Math.min(fi ? prog(t, a, a + fi) : (t >= a ? 1 : 0), fo ? 1 - prog(t, b - fo, b) : (t < b ? 1 : 0));
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const C = {
  sil: '#06080d', lantern: '#ffb35c', cold: '#7fb6ff', ember: '#d8643a', blood: '#c0392b', gold: '#f2c14e',
  subF: '#ffc27a', subJ: '#8cc4ff', subN: '#b9c0cc'
};
const LIGHTNING = [0.6, 9.6, 15.3, 28.65, 37.0];

// ---------- 공통 ----------
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function glow(x, y, r, color, a) {
  if (a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function txt(s, x, y, size, color, align = 'center', stroke = null, weight = 0.05) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = size * 0.22; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.lineWidth = size * weight; ctx.strokeStyle = color; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function flashAmt(t) { // 번개 섬광 세기
  let f = 0;
  for (const lt of LIGHTNING) {
    const d = t - lt;
    if (d >= 0 && d < 0.6) f = Math.max(f, (d < 0.06 ? 1 : d < 0.12 ? 0.3 : d < 0.18 ? 0.8 : Math.exp(-(d - 0.18) / 0.12)) * (lt === 9.6 ? 0.35 : 1));
  }
  return f;
}
function shakeAmt(t) {
  let s = 0;
  for (const lt of [0.6, 15.3, 28.65, 37.0]) { const d = t - lt; if (d >= 0 && d < 0.8) s = Math.max(s, (1 - d / 0.8) * 14); }
  return s;
}
function voiceLevel(t, who) { // who: 1 여, 2 요나, 3 나레이션
  const i = Math.min(TL.env.length - 1, Math.max(0, Math.round(t * FPS)));
  return TL.who[i] === who ? Math.min(1, TL.env[i]) : 0;
}

// ---------- 하늘·구름·바다 ----------
function sky(top, mid, hz, horizonY, emberA = 0.5) {
  const g = ctx.createLinearGradient(0, 0, 0, horizonY);
  g.addColorStop(0, top); g.addColorStop(0.65, mid); g.addColorStop(1, hz);
  ctx.fillStyle = g; ctx.fillRect(-100, -100, W + 200, horizonY + 110);
  glow(W * 0.62, horizonY, 700, 'rgba(216,100,58,.55)', emberA);
}
function clouds(t, y0, y1, dark, speed = 12, n = 16, alpha = 0.85) {
  for (let i = 0; i < n; i++) {
    const w = 380 + rnd(i) * 520, h = 70 + rnd(i + 9) * 90;
    const x = ((rnd(i + 3) * (W + 800) + t * speed * (0.6 + rnd(i + 5))) % (W + 800)) - 400;
    const y = lerp(y0, y1, rnd(i + 7));
    ctx.save(); ctx.globalAlpha *= alpha * (0.5 + 0.5 * rnd(i + 11));
    ctx.fillStyle = dark;
    for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.ellipse(x + (k - 2) * w * 0.2, y + Math.sin(k * 2.1 + i) * h * 0.25, w * 0.3, h * (0.6 + 0.4 * rnd(i * 5 + k)), 0, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}
function sea(t, hy, rough = 1, cols = ['#1a2c44', '#132339', '#0d1a2b', '#08111d'], foam = true) {
  const L = cols.length;
  for (let i = 0; i < L; i++) {
    const y0 = lerp(hy, H + 60, Math.pow(i / L, 1.4));
    const A = (6 + i * 10) * rough, f = 0.006 / (1 + i * 0.4);
    ctx.beginPath(); ctx.moveTo(-50, H + 100);
    for (let x = -50; x <= W + 50; x += 16) ctx.lineTo(x, y0 + A * Math.sin(x * f + t * (0.8 + i * 0.35) + i * 1.7) + A * 0.45 * Math.sin(x * f * 2.6 - t * (1.3 + i * 0.3) + i));
    ctx.lineTo(W + 50, H + 100); ctx.closePath(); ctx.fillStyle = cols[i]; ctx.fill();
    if (foam && i > 0) {
      ctx.save(); ctx.globalAlpha = 0.12 + 0.05 * i; ctx.strokeStyle = '#9fb7d6'; ctx.lineWidth = 2 + i;
      ctx.beginPath();
      for (let x = -50; x <= W + 50; x += 16) {
        const y = y0 + A * Math.sin(x * f + t * (0.8 + i * 0.35) + i * 1.7) + A * 0.45 * Math.sin(x * f * 2.6 - t * (1.3 + i * 0.3) + i);
        x === -50 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke(); ctx.restore();
    }
  }
}
function lightningBolt(t, x0, y0, y1, seed) {
  for (const lt of LIGHTNING) {
    const d = t - lt;
    if (d < 0 || d > 0.35 || lt === 9.6) continue;
    const a = d < 0.08 ? 1 : d < 0.14 ? 0.2 : Math.max(0, 1 - (d - 0.14) / 0.2);
    ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = '#e8f1ff'; ctx.lineWidth = 5; ctx.shadowColor = '#9ec8ff'; ctx.shadowBlur = 30;
    ctx.beginPath(); let x = x0 + (rnd(lt * 10 + seed) - 0.5) * 400, y = y0; ctx.moveTo(x, y);
    let k = 0;
    while (y < y1) { y += 40 + rnd(lt + k + seed) * 50; x += (rnd(lt * 3 + k + seed) - 0.5) * 110; ctx.lineTo(x, y); k++; }
    ctx.stroke(); ctx.restore();
  }
}
function rain(t, k, slant = 0.25) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = 0.35 * k; ctx.strokeStyle = '#a9c2e6'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 220; i++) {
    const x = (rnd(i) * (W + 400) - t * 300 * slant * 4) % (W + 400), y = (rnd(i + 50) * H + t * 1600 * (0.8 + rnd(i + 3) * 0.4)) % (H + 100) - 50;
    const xx = x < -200 ? x + W + 400 : x;
    ctx.moveTo(xx, y); ctx.lineTo(xx - 30 * slant, y + 34);
  }
  ctx.stroke(); ctx.restore();
}

// ---------- 배 ----------
function ship(x, y, s, t, sailK = 1, lanternA = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 1.3) * 0.025); ctx.scale(s, s);
  // 밧줄
  ctx.strokeStyle = 'rgba(20,14,10,.9)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, -540); ctx.lineTo(-310, -70); ctx.moveTo(0, -540); ctx.lineTo(290, -100); ctx.moveTo(-20, -540); ctx.lineTo(-200, -60); ctx.stroke();
  // 돛대
  ctx.fillStyle = '#1b120c'; ctx.fillRect(-9, -560, 18, 520);
  ctx.fillRect(-200, -505, 400, 12);
  // 돛
  if (sailK > 0) {
    const sh = 360 * sailK, bil = 40 * sailK * (1 + 0.15 * Math.sin(t * 2));
    ctx.beginPath(); ctx.moveTo(-190, -495);
    ctx.lineTo(190, -495); ctx.quadraticCurveTo(190 + bil * 0.3, -495 + sh / 2, 175, -495 + sh);
    ctx.quadraticCurveTo(0, -495 + sh + bil * 0.6, -175, -495 + sh); ctx.quadraticCurveTo(-190 - bil * 0.3, -495 + sh / 2, -190, -495);
    ctx.fillStyle = '#6e6250'; ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle = 'rgba(140,40,30,.55)'; for (let k = -1; k <= 1; k += 2) ctx.fillRect(k * 70 - 22, -500, 44, sh + 60); ctx.restore();
  } else {
    ctx.fillStyle = '#4e4538'; rrect(-190, -500, 380, 26, 12); ctx.fill();
  }
  // 선체
  ctx.beginPath(); ctx.moveTo(-340, -95); ctx.quadraticCurveTo(-300, 30, -220, 45); ctx.lineTo(220, 45);
  ctx.quadraticCurveTo(300, 30, 330, -130); ctx.lineTo(285, -130); ctx.lineTo(260, -70); ctx.lineTo(-300, -70); ctx.closePath();
  ctx.fillStyle = '#20150e'; ctx.fill();
  ctx.fillStyle = '#3a271a'; ctx.fillRect(-300, -72, 560, 10);
  for (let k = 0; k < 9; k++) circle(-220 + k * 52, -20, 7, '#120b07');
  // 랜턴
  for (const [lx, ly] of [[300, -150], [-320, -115]]) {
    glow(lx, ly, 120, 'rgba(255,179,92,.7)', lanternA * (0.8 + 0.2 * Math.sin(t * 7 + lx)));
    circle(lx, ly, 9, C.lantern);
  }
  ctx.restore();
}

// ---------- 인물 실루엣 ----------
function rimFill(pathFn, rim, rimA, dir) {
  ctx.save();
  ctx.shadowColor = rim; ctx.shadowBlur = 26 + 30 * rimA; ctx.shadowOffsetX = dir * (4 + 6 * rimA); ctx.shadowOffsetY = -3;
  ctx.globalAlpha *= 1; pathFn(); ctx.fillStyle = C.sil; ctx.fill();
  ctx.restore();
  // 테두리 빛 (얇은 선)
  ctx.save(); ctx.globalAlpha *= 0.35 + 0.55 * rimA; pathFn(); ctx.lineWidth = 2.5; ctx.strokeStyle = rim; ctx.stroke(); ctx.restore();
  ctx.save(); pathFn(); ctx.fillStyle = C.sil; ctx.translate(-dir * 2, 0); ctx.fill(); ctx.restore();
}
// 상반신 옆모습 (facing 1: 오른쪽을 봄). type 'j' 요나(두건·수염), 'f' 여인(베일)
function bustPath(type) {
  return () => {
    ctx.beginPath();
    if (type === 'j') {
      ctx.moveTo(-200, 320); ctx.lineTo(-190, 120); ctx.quadraticCurveTo(-170, 20, -95, -10);
      ctx.quadraticCurveTo(-120, -120, -90, -210); ctx.quadraticCurveTo(-40, -300, 40, -285); // 두건 뒤·위
      ctx.quadraticCurveTo(95, -270, 98, -205); ctx.lineTo(110, -175); ctx.lineTo(102, -165); // 이마·코
      ctx.lineTo(108, -140); ctx.lineTo(98, -132); ctx.lineTo(104, -118); // 입술
      ctx.quadraticCurveTo(100, -70, 60, -45); // 수염
      ctx.quadraticCurveTo(70, -10, 120, 10); ctx.quadraticCurveTo(190, 40, 200, 140); ctx.lineTo(210, 320); ctx.closePath();
    } else {
      ctx.moveTo(-210, 320); ctx.lineTo(-200, 140); ctx.quadraticCurveTo(-190, 40, -130, 0);
      ctx.quadraticCurveTo(-150, -150, -95, -235); ctx.quadraticCurveTo(-20, -310, 50, -278); // 베일
      ctx.quadraticCurveTo(80, -262, 82, -215); ctx.lineTo(96, -185); ctx.lineTo(86, -176); // 코
      ctx.lineTo(92, -158); ctx.lineTo(84, -150); ctx.lineTo(88, -138); ctx.quadraticCurveTo(84, -112, 60, -108); // 턱
      ctx.lineTo(48, -70); ctx.quadraticCurveTo(70, -20, 120, 0); ctx.quadraticCurveTo(190, 40, 195, 140); ctx.lineTo(205, 320); ctx.closePath();
    }
  };
}
function bust(x, y, s, type, facing, rim, rimA, t) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 1.6 + (type === 'j' ? 1 : 0)) * 3); ctx.scale(s * facing, s);
  rimFill(bustPath(type), rim, rimA, -1);
  ctx.restore();
}
// 전신 실루엣 (작은 크기), facing 1: 오른쪽
function figure(x, y, s, type, facing, t, walk = 0, rim = C.lantern, rimA = 0.3, reach = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * facing, s);
  const ph = walk * TAU;
  const path = () => {
    ctx.beginPath();
    // 다리
    const l1 = Math.sin(ph) * 22, l2 = -Math.sin(ph) * 22;
    ctx.moveTo(-14 + l1, 0); ctx.lineTo(-4 + l1, 0); ctx.lineTo(0, -80); ctx.lineTo(4 + l2, 0); ctx.lineTo(14 + l2, 0); ctx.lineTo(10, -90);
    // 몸 (망토/옷)
    ctx.moveTo(-38, -60); ctx.quadraticCurveTo(-44, -150, -26, -190); ctx.lineTo(26, -190); ctx.quadraticCurveTo(46, -150, 40, -60); ctx.closePath();
    ctx.moveTo(14, -200); ctx.arc(0, -210, type === 'f' ? 21 : 23, 0, TAU);
    if (type === 'f') { ctx.moveTo(-20, -222); ctx.quadraticCurveTo(-40, -150, -34, -90); ctx.lineTo(-10, -180); ctx.closePath(); }
    else { ctx.moveTo(18, -200); ctx.quadraticCurveTo(26, -176, 8, -172); ctx.lineTo(10, -195); ctx.closePath(); } // 수염
    // 팔 (손 뻗기)
    if (reach > 0) { ctx.moveTo(20, -170); ctx.lineTo(20 + 60 * reach, -150 - 10 * reach); ctx.lineTo(24 + 60 * reach, -140 - 10 * reach); ctx.lineTo(18, -150); ctx.closePath(); }
  };
  rimFill(path, rim, rimA, -1);
  if (type === 'j') { // 지팡이 & 보따리
    ctx.strokeStyle = C.sil; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(36, -230 + Math.sin(ph) * 4); ctx.lineTo(44, 0 + Math.sin(ph) * 4); ctx.stroke();
    ctx.fillStyle = C.sil; ctx.beginPath(); ctx.ellipse(-40, -150, 22, 30, 0.3, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function pier(x0, x1, y, t) {
  ctx.fillStyle = '#120d09';
  for (let x = x0 + 20; x < x1; x += 120) ctx.fillRect(x, y, 16, 220);
  ctx.fillStyle = '#1c140e'; ctx.fillRect(x0, y - 18, x1 - x0, 26);
  ctx.fillStyle = '#2b1f15'; ctx.fillRect(x0, y - 18, x1 - x0, 5);
  // 기둥 랜턴
  const lx = x1 - 60;
  ctx.fillStyle = '#120d09'; ctx.fillRect(lx - 5, y - 150, 10, 140);
  glow(lx, y - 158, 160, 'rgba(255,179,92,.65)', 0.85 + 0.15 * Math.sin(t * 9));
  circle(lx, y - 158, 10, C.lantern);
}

// ---------- 장면들 ----------
function sceneTitle(t) { // 0–3.2
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const f = flashAmt(t);
  if (f > 0) { ctx.save(); ctx.globalAlpha = f * 0.6; sky('#1a2740', '#33496b', '#5a6f8f', 640, 0); sea(t, 640, 1.4, ['#22344f', '#17263b', '#0e1828', '#08111d'], false); ctx.restore(); }
  const a = prog(t, 0.6, 1.2) * (1 - prog(t, 2.7, 3.15));
  const sc = 1 + t * 0.02;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 520); ctx.scale(sc, sc);
  txt('요 나', 0, 0, 170, '#e9edf3', 'center', null, 0.06);
  ctx.globalAlpha *= prog(t, 1.2, 1.7);
  ctx.fillStyle = C.ember; ctx.fillRect(-220 * prog(t, 1.2, 1.8), 45, 440 * prog(t, 1.2, 1.8), 4);
  txt('도망치는 선지자', 0, 120, 48, '#b9c0cc', 'center', null, 0.02);
  ctx.restore();
}
function sceneHarbor(t) { // 3.0–8.4 (나레이션)
  const lt = t - 3;
  const z = 1.12 - lt * 0.02;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2 + lt * 8, -H / 2);
  const hy = 620;
  sky('#070c18', '#1a2640', '#5b3a35', hy, 0.6);
  clouds(t, 60, 330, '#0b1222', 14, 14, 0.9);
  sea(t, hy, 0.9);
  ship(1250, hy + 70, 0.95, t, 0, 1);
  pier(-100, 900, hy + 90, t);
  figure(780, hy + 72, 1.25, 'j', 1, t, 0, C.lantern, 0.5 + 0.3 * voiceLevel(t, 3));
  figure(420, hy + 72, 1.1, 'f', 1, t, 0, C.lantern, 0.4);
  // 갈매기
  for (let i = 0; i < 3; i++) {
    const gx = (300 + i * 260 + lt * (80 + i * 20)) % W, gy = 220 + i * 50 + Math.sin(lt * 2 + i) * 20, fl = Math.sin(t * 8 + i) * 12;
    ctx.strokeStyle = '#05070c'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(gx - 22, gy - fl); ctx.quadraticCurveTo(gx - 10, gy - 6, gx, gy); ctx.quadraticCurveTo(gx + 10, gy - 6, gx + 22, gy - fl); ctx.stroke();
  }
  ctx.restore();
}
function dialogueBG(t, hy = 700, blur = true) {
  sky('#070c18', '#18233a', '#4e3333', hy, 0.5);
  clouds(t, 40, 360, '#0a1120', 16, 12, 0.9);
  sea(t, hy, 1, ['#15243a', '#0f1c2e', '#0a1422', '#060c16'], false);
  ship(1500, hy + 40, 0.6, t, 0, 0.7);
  // 보케(흐릿한 항구 불빛)
  for (let i = 0; i < 9; i++) glow(100 + i * 210 + Math.sin(t + i) * 6, hy - 10 + (i % 3) * 18, 50 + (i % 3) * 18, 'rgba(255,170,90,.5)', 0.35 + 0.15 * Math.sin(t * 2 + i));
}
function sceneTwoShot(t) { // 8.2–12.2 여: 니느웨로 가라고 하셨다면서요?
  const lt = t - 8.2;
  const cam = eio(prog(t, 8.2, 11.5));
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(1.05 + cam * 0.06, 1.05 + cam * 0.06); ctx.translate(-W / 2 - 40 + cam * 60, -H / 2);
  dialogueBG(t);
  // 동쪽 하늘의 불길한 붉은 빛 — "니느웨"
  const nin = prog(t, 9.4, 10.2) * (1 - prog(t, 11.6, 12.2));
  glow(W - 100, 520, 600, 'rgba(192,57,43,.8)', nin * 0.7);
  bust(560, 760, 1.25, 'f', 1, C.lantern, 0.35 + 0.65 * voiceLevel(t, 1), t);
  bust(1380, 800, 1.35, 'j', -1, C.cold, 0.25, t);
  ctx.restore();
}
function sceneNineveh(t) { // 12.0–14.7 요나: 그 악한 도시에 가서 말씀을 전하라고?
  const lt = t - 12;
  const z = 1.0 + lt * 0.035;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#12040a'); g.addColorStop(0.55, '#5a1410'); g.addColorStop(0.75, '#a63a1c'); g.addColorStop(1, '#1a0606');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  clouds(t, 80, 380, '#2a0a0c', 30, 14, 0.85);
  // 연기 기둥
  for (let i = 0; i < 6; i++) {
    const sx = 300 + i * 270;
    for (let k = 0; k < 10; k++) {
      const p = ((lt * 0.25 + k / 10 + i * 0.13) % 1);
      ctx.save(); ctx.globalAlpha = 0.25 * (1 - p); circle(sx + Math.sin(p * 6 + i) * 40 * p, 700 - p * 600, 30 + p * 90, '#1c0707'); ctx.restore();
    }
  }
  // 성벽과 탑, 지구라트
  ctx.fillStyle = '#0a0304';
  ctx.beginPath(); ctx.moveTo(0, H);
  ctx.lineTo(0, 760);
  const towers = [[120, 640], [330, 600], [560, 660], [860, 520], [1180, 610], [1420, 560], [1700, 640], [1880, 600]];
  let px = 0;
  towers.forEach(([tx, ty]) => { ctx.lineTo(tx - 60, 760); ctx.lineTo(tx - 60, ty); for (let b = 0; b < 4; b++) { ctx.lineTo(tx - 60 + b * 30, ty - 18); ctx.lineTo(tx - 45 + b * 30, ty - 18); ctx.lineTo(tx - 45 + b * 30, ty); ctx.lineTo(tx - 30 + b * 30, ty); } ctx.lineTo(tx + 60, ty); ctx.lineTo(tx + 60, 760); });
  ctx.lineTo(W, 760); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  // 지구라트
  for (let s = 0; s < 4; s++) ctx.fillRect(960 - 220 + s * 50, 760 - (s + 1) * 70, 440 - s * 100, 72);
  // 창 불빛 (붉게 깜빡)

function sceneRefuse(t) { // 14.7–17.4 요나: 난 가고 싶지 않소. (돌아섬)

function sceneMap(t) { // 17.3–20.9 여: 반대 방향인 다시스로?
  const lt = t - 17.3;

  ctx.strokeStyle = 'rgba(80,120,150,.6)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(1600, 200); ctx.bezierCurveTo(1640, 400, 1700, 600, 1820, 900); ctx.stroke();
  // 격자

  ctx.save(); ctx.globalAlpha = dim; ctx.setLineDash([18, 14]); ctx.lineDashOffset = -t * 40; ctx.strokeStyle = C.gold; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(...J); ctx.quadraticCurveTo(1320, 380, lerp(J[0], N[0], g1), lerp(J[1], N[1], g1)); ctx.stroke(); ctx.restore();
  glow(N[0], N[1], 160, 'rgba(192,57,43,.9)', prog(t, 17.8, 18.3) * (0.7 + 0.3 * Math.sin(t * 5)));

    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.stroke();
    const e = pts[pts.length - 1];

  }
  // 지명
  const lab = prog(t, 17.4, 17.8);
  ctx.save(); ctx.globalAlpha = lab;
  circle(...J, 12, '#fff3d6'); txt('욥바', J[0] + 30, J[1] + 12, 40, '#fff3d6', 'left', 'rgba(0,0,0,.6)', 0.03);
  circle(...N, 12, '#ffb3a6'); txt('니느웨', N[0], N[1] - 32, 40, '#ffb3a6', 'center', 'rgba(0,0,0,.6)', 0.03);
  ctx.globalAlpha = prog(t, 18.6, 19.2);
  circle(...T, 12, '#ffd9a6'); txt('다시스', T[0] + 10, T[1] - 32, 40, '#ffd9a6', 'center', 'rgba(0,0,0,.6)', 0.03);
  ctx.restore();

  ctx.strokeStyle = '#e8d9b8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 70, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#e8d9b8'; ctx.beginPath(); ctx.moveTo(0, -80); ctx.lineTo(14, 0); ctx.lineTo(0, 80); ctx.lineTo(-14, 0); ctx.closePath(); ctx.fill();

function sceneLonging(t) { // 20.8–25.9 요나: 그렇소. 지금은 그저… 멀리 떠나고 싶소.

  ctx.restore();

const SCENES = [
  [0, 3.2, sceneTitle], [3.0, 8.4, sceneHarbor], [8.2, 12.15, sceneTwoShot], [12.0, 14.8, sceneNineveh], [14.7, 17.45, sceneRefuse],
  [17.3, 20.95, sceneMap], [20.8, 25.95, sceneLonging], [25.8, 29.75, sceneSea], [29.6, 31.95, sceneHorn], [31.8, 34.25, sceneBoard], [34.0, 40.1, sceneDepart],
];

function subtitles(t) {
  const s = TL.subs.find(s => t >= s.start - 0.05 && t < s.end);
  if (!s) return;
  const a = Math.min(prog(t, s.start - 0.05, s.start + 0.12), 1 - prog(t, s.end - 0.15, s.end));
  const lines = s.text.split('|');
  const col = s.who === 'f' ? C.subF : s.who === 'j' ? C.subJ : C.subN;
  const name = s.who === 'f' ? '여인' : s.who === 'j' ? '요나' : '';
  ctx.save(); ctx.globalAlpha = a;
  const base = H - 150 - (lines.length - 1) * 30;
  lines.forEach((ln, i) => {
    const y = base + i * 62 + (1 - eout(prog(t, s.start - 0.05, s.start + 0.2))) * 14;
    const txtS = s.who === 'narr' ? `[ ${ln} ]` : ln;
    txt(txtS, W / 2, y, 48, s.who === 'narr' ? C.subN : '#ffffff', 'center', 'rgba(0,0,0,.85)', 0.03);
    if (i === 0 && name) {
      ctx.font = `48px ${FONT}`; const tw = ctx.measureText(txtS).width;
      const nx = W / 2 - tw / 2 - 30;
      ctx.font = `34px ${FONT}`; const nw = ctx.measureText(name).width;
      ctx.fillStyle = col; rrect(nx - nw - 26, y - 38, nw + 26, 48, 10); ctx.fill();
      txt(name, nx - nw / 2 - 13, y - 2, 34, '#0b0f17', 'center', null, 0.04);
    }
  });
  ctx.restore();
}

window.renderFrame = function (t) {
  ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const sh = shakeAmt(t);
  ctx.save(); ctx.translate((rnd(Math.floor(t * 30)) - 0.5) * sh, (rnd(Math.floor(t * 30) + 5) - 0.5) * sh);
  for (const [a, b, fn] of SCENES) {
    if (t < a || t >= b) continue;
    const alpha = Math.min(prog(t, a, a + 0.2) || (a === 0 ? 1 : 0), 1 - prog(t, b - 0.2, b));
    ctx.save(); ctx.globalAlpha = a === 0 ? Math.min(1, 1 - prog(t, b - 0.2, b)) : alpha; fn(t); ctx.restore();
  }
  ctx.restore();
  // 번개 섬광
  const f = flashAmt(t);
  if (f > 0) { ctx.fillStyle = `rgba(220,232,255,${f * 0.55})`; ctx.fillRect(0, 0, W, H); }
  // 비네팅 & 필름 그레인
  const v = ctx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const fr = Math.floor(t * 30);
  ctx.fillStyle = 'rgba(255,255,255,.035)';
  for (let i = 0; i < 500; i++) ctx.fillRect(rnd(i + fr * 0.37) * W, rnd(i * 1.7 + fr) * H, 2, 2);
  // 시네마 레터박스
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 90); ctx.fillRect(0, H - 90, W, 90);
  subtitles(t);
  // 끝 페이드
  const e = prog(t, DUR - 0.6, DUR);
  if (e > 0) { ctx.fillStyle = `rgba(0,0,0,${e})`; ctx.fillRect(0, 0, W, H); }
};
window.ready = document.fonts.load(`48px ${FONT}`);
