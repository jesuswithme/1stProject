<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:GB;src:url(fonts/GowunBatang-Bold.ttf)}
@font-face{font-family:GR;src:url(fonts/GowunBatang-Regular.ttf)}
@font-face{font-family:NS;src:url(fonts/NotoSansKR.ttf);font-weight:100 900}
@font-face{font-family:NSe;src:url(fonts/NotoSerifKR.ttf);font-weight:200 900}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#050b16}
#root{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
canvas{position:absolute;left:0;top:0}
.L{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 500px}
.a{position:absolute;left:0;top:0;white-space:nowrap;word-break:keep-all;will-change:transform,opacity}
.gold{background:linear-gradient(180deg,#fff6da 0%,#f7d28a 45%,#d99a40 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gb{font-family:GB,serif}.gr{font-family:GR,serif}.ns{font-family:NS,sans-serif}
.glow{filter:drop-shadow(0 0 18px rgba(247,200,120,.55)) drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.shadow{text-shadow:0 4px 18px rgba(0,0,0,.55)}
.ch{display:inline-block}
svg{position:absolute;left:0;top:0;overflow:visible}
#sub{position:absolute;left:0;right:0;top:885px;text-align:center}
#subbox{display:inline-block;padding:14px 40px 16px;border-radius:16px;background:rgba(6,9,18,.52);border:1px solid rgba(247,210,138,.18);
 font-family:NS;font-weight:500;font-size:42px;line-height:1.42;color:#fbf6ec;letter-spacing:-.5px;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#fffaf0,#ffe2a8 60%,#f0b860);opacity:0}
#black{position:absolute;inset:0;background:#000;opacity:1}
</style></head><body><div id="root">
<canvas id="cv" width="1920" height="1080"></canvas>
<div id="scenes"></div>
<div id="hud" class="L"></div>
<div id="sting" class="L"></div>
<div id="sub"><div id="subbox"></div></div>
<div id="vig"></div><div id="flash"></div><div id="black"></div>
</div>
<script>
const TL=__TL__;
const W=1920,H=1080;
const S={};TL.forEach((s,i)=>{S[s.id]=s;s.i=i});
const SC=id=>S[id].start,SE=id=>S[id].end,LT=(id,i)=>S[id].lines[i].t,LE=(id,i)=>S[id].lines[i].e;
window.TOTAL=SE('outro');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,ei=x=>x*x;
const eback=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const win=(t,a,b,fi=.5,fo=.5)=>Math.min(P(t,a,a+fi),1-P(t,b-fo,b));
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(par,tag,cls,css,html){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;par.appendChild(e);return e}
function place(e,x,y,s=1,r=0,op=null,blur=0){e.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${r}deg)`;if(op!==null)e.style.opacity=op;e.style.filter=blur>0.05?`blur(${blur}px)`:''}
function chars(el,text,cls){el.innerHTML='';return [...text].map(c=>{const s=mk(el,'span','ch'+(cls?' '+cls:''),c===' '?'width:.28em':'');s.textContent=c===' '?' ':c;return s})}
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mixc=(a,b,x)=>a.map((v,i)=>Math.round(lerp(v,b[i],x)));
const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const sceneAt=t=>{let k=0;TL.forEach((s,i)=>{if(t>=s.start)k=i});return k};

/* ---------------- background + canvas fx ---------------- */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const BG={intro:['#040914','#0d1730'],winter:['#07101e','#1b2c48'],breath:['#07121e','#123040'],confess:['#140e1a','#4a2c16'],why:['#0d0d11','#211e27'],
 miracle:['#0b0703','#221508'],embrace:['#0d1832','#3a2638'],love:['#100b24','#3f2238'],outro:['#04060d','#191329']};
const DUST={intro:.8,winter:.15,breath:.55,confess:.75,why:.35,miracle:1,embrace:.6,love:1,outro:.9};
function bgCols(id,t){
 let [a,b]=BG[id].map(hex);
 if(id==='miracle'){const x=P(t,SC('miracle')+2.2,SC('miracle')+4);a=mixc(a,hex('#2a1806'),x);b=mixc(b,hex('#6e4512'),x)}
 if(id==='embrace'){const x=eio(P(t,SC('embrace'),SC('embrace')+6));a=mixc(a,hex('#2c4f86'),x);b=mixc(b,hex('#f2a062'),x)}
 return [a,b]}
function mixState(t){const k=sceneAt(t),cur=TL[k],prev=TL[Math.max(0,k-1)];const x=k===0?1:eio(P(t,cur.start-.2,cur.start+1.4));return {prev:prev.id,cur:cur.id,x}}
const R=rng(11);
const dust=[...Array(190)].map(()=>({x:R(),y:R(),s:R()*2.2+.6,v:R()*16+5,ph:R()*6.28,vx:(R()-.5)*12}));
const snow=[...Array(280)].map(()=>({x:R(),y:R(),s:R()*3.2+1.1,v:R()*.7+.6,ph:R()*6.28,a:R()*.5+.5}));
const motes=[...Array(120)].map(()=>({x:980+R()*720,y:260+R()*300,v:R()*70+40,s:R()*2.6+1,ph:R()*6.28,d:R()*1.8}));
const burst=[...Array(110)].map(()=>({a:R()*6.283,v:R()*760+220,s:R()*3.2+1.4,tw:R()*6}));
const W1=()=>LT('winter',0),W2=()=>LT('winter',1);
function sspeed(u){return 1+1.6*win(u,W1()+1.0,W2()+0.6,.6,1.6)-0.78*P(u,W2()+2.0,W2()+4.2)}
function sclock(t){let s=0;for(let u=0;u<t;u+=.05)s+=sspeed(u)*.05;return s}
function orb(x,y,r,a,c=[255,214,140]){if(a<=0)return;const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgb([255,250,235],a));g.addColorStop(.12,rgb(c,a*.85));g.addColorStop(.45,rgb(c,a*.22));g.addColorStop(1,rgb(c,0));cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
function drawCanvas(t){
 const m=mixState(t);const [pa,pb]=bgCols(m.prev,t),[ca,cb]=bgCols(m.cur,t);
 const top=mixc(pa,ca,m.x),bot=mixc(pb,cb,m.x);
 const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,rgb(top));g.addColorStop(1,rgb(bot));cx.fillStyle=g;cx.fillRect(0,0,W,H);
 cx.save();cx.globalCompositeOperation='lighter';
 // embrace sun
 {const e0=SC('embrace');const a=win(t,e0-.3,SE('embrace')+1,1.2,1.6);if(a>0){const sy=lerp(1320,600,eo(P(t,e0,e0+5.5)));
   orb(960,sy,1100,.55*a,[255,170,90]);orb(960,sy,420,.6*a,[255,205,130]);
   cx.fillStyle=rgb([255,244,214],.95*a);cx.beginPath();cx.arc(960,sy,150,0,7);cx.fill()}}
 // winter small light
 {const o0=W2()+2.3;const a=P(t,o0,o0+.9)*(1-P(t,SE('winter')-.6,SE('winter')+.4));if(a>0){const pul=1+.06*Math.sin(t*3);orb(960,450,360*eback(P(t,o0,o0+1))*pul,.9*a)}}
 // confess god rays
 {const c=S.confess;const a=win(t,c.start+.2,c.end+.6,1.4,1.4)*(.45+.55*P(t,LT('confess',1)+.6,LT('confess',1)+3.2))*(1-.35*P(t,LT('confess',2)+.5,LT('confess',2)+2));
  if(a>0){const ox=440,oy=330;for(let i=0;i<11;i++){const ang=lerp(.05,1.0,i/10)+Math.sin(t*.35+i*1.3)*.025,w=.03+.02*Math.abs(Math.sin(i*1.7));
   const L=2100,x1=ox+Math.cos(ang-w)*L,y1=oy+Math.sin(ang-w)*L,x2=ox+Math.cos(ang+w)*L,y2=oy+Math.sin(ang+w)*L;
   const gr=cx.createLinearGradient(ox,oy,ox+Math.cos(ang)*L,oy+Math.sin(ang)*L);gr.addColorStop(0,rgb([255,214,150],a*.26*(.5+.5*Math.sin(i*2.3+t*.6))));gr.addColorStop(1,rgb([255,214,150],0));
   cx.fillStyle=gr;cx.beginPath();cx.moveTo(ox,oy);cx.lineTo(x1,y1);cx.lineTo(x2,y2);cx.closePath();cx.fill()}
   orb(440,330,520,.5*a,[255,196,120])}}
 // miracle: light line + conic rays + shock + burst + breath rings
 {const m0=SC('miracle'),fl=m0+2.25,mE=SE('miracle');
  const la=P(t,fl-1,fl)*(1-P(t,fl,fl+.6));if(la>0){const w=eio(P(t,fl-1,fl))*W;const gr=cx.createLinearGradient(960-w/2,0,960+w/2,0);gr.addColorStop(0,'rgba(255,220,150,0)');gr.addColorStop(.5,'rgba(255,248,225,1)');gr.addColorStop(1,'rgba(255,220,150,0)');cx.fillStyle=gr;cx.fillRect(960-w/2,428-2-6*la,w,4+12*la);orb(960,430,300*la,.6*la)}
  const ra=win(t,fl,mE+.4,.8,1.2);if(ra>0){cx.save();cx.translate(960,430);cx.rotate(t*.12);for(let i=0;i<28;i++){const an=i/28*6.283,w=.045;const gr=cx.createLinearGradient(0,0,Math.cos(an)*1400,Math.sin(an)*1400);gr.addColorStop(0,rgb([255,220,150],.22*ra));gr.addColorStop(1,rgb([255,220,150],0));cx.fillStyle=gr;cx.beginPath();cx.moveTo(0,0);cx.lineTo(Math.cos(an-w)*1400,Math.sin(an-w)*1400);cx.lineTo(Math.cos(an+w)*1400,Math.sin(an+w)*1400);cx.fill()}cx.restore();orb(960,430,700,.35*ra)}
  const m1=LT('miracle',1)+.08;for(const d of [0,.18]){const p=P(t,m1+d,m1+d+1.3);if(p>0&&p<1){cx.strokeStyle=rgb([255,226,160],(1-p)*.9);cx.lineWidth=14*(1-p)+2;cx.beginPath();cx.arc(960,400,eo(p)*1150,0,7);cx.stroke()}}
  const k=LT('miracle',1)+1.15,bp=P(t,k,k+2.6);if(bp>0&&bp<1){for(const b of burst){const r=eo(bp)*b.v;const a=(1-bp)*(.6+.4*Math.sin(t*12+b.tw));cx.fillStyle=rgb([255,232,170],a);cx.beginPath();cx.arc(960+Math.cos(b.a)*r,610+Math.sin(b.a)*r*.8,b.s*(1.4-bp),0,7);cx.fill()}}
  const m2=LT('miracle',2);for(let j=0;j<7;j++){const s0=m2+.1+j*1.05,p=P(t,s0,s0+2.4);if(p>0&&p<1&&t<mE+.3){cx.strokeStyle=rgb([255,226,160],(1-p)*.45);cx.lineWidth=3;cx.beginPath();cx.arc(960,385,175+eo(p)*760,0,7);cx.stroke()}}}
 // outro orb
 {const a=win(t,SC('outro')-.5,SE('outro'),2,2.5);orb(960,470,760,.35*a)}
 // dust / stars
 {const amt=lerp(DUST[m.prev],DUST[m.cur],m.x);const star=(m.cur==='love'||m.cur==='intro'||m.cur==='outro')?1:0;
  for(const d of dust){const x=((d.x*W+d.vx*t)%W+W)%W,y=((d.y*H-d.v*t)%H+H)%H;const tw=.5+.5*Math.sin(t*1.7+d.ph);const a=amt*tw*.55;if(a<.02)continue;
   cx.fillStyle=star&&d.s<1.4?rgb([230,236,255],a):rgb([255,214,150],a);cx.beginPath();cx.arc(x,y,d.s,0,7);cx.fill()}}
 // snow
 {const sa=win(t,SC('winter')-.4,SC('breath')+1.4,1.4,1.8);if(sa>0){const ck=sclock(t)*72;const gx=P(t,W2()+2.3,W2()+4);const col=mixc([232,242,255],[255,214,150],gx);
  for(const s of snow){const y=((s.y*(H+60)+ck*s.v)%(H+60))-30;const x=((s.x*W+ck*.25+Math.sin(t*.9+s.ph)*30)%W+W)%W;cx.fillStyle=rgb(col,sa*s.a*.85);cx.beginPath();cx.arc(x,y,s.s*(1+gx*.2),0,7);cx.fill()}}}
 // confess rising motes
 {const c2=LT('confess',2)+.3;const a=win(t,c2,SE('confess')+.5,.8,1.4);if(a>0){for(const q of motes){const dt=Math.max(0,t-c2-q.d*.5);const y=q.y-dt*q.v;const x=q.x+Math.sin(dt*1.5+q.ph)*24;cx.fillStyle=rgb([255,226,160],a*(.5+.5*Math.sin(t*4+q.ph))*cl(1-dt/5));cx.beginPath();cx.arc(x,y,q.s,0,7);cx.fill()}}}
 // light leak sweeps at scene cuts
 TL.forEach((s,i)=>{if(i===0)return;const p=P(t,s.start-.7,s.start+.7);if(p<=0||p>=1)return;const x=lerp(-700,W+700,eio(p));const gr=cx.createLinearGradient(x-420,0,x+420,0);gr.addColorStop(0,'rgba(255,190,110,0)');gr.addColorStop(.5,`rgba(255,215,160,${.32*Math.sin(p*Math.PI)})`);gr.addColorStop(1,'rgba(255,190,110,0)');cx.save();cx.translate(x,540);cx.rotate(-.25);cx.translate(-x,-540);cx.fillStyle=gr;cx.fillRect(x-420,-400,840,H+800);cx.restore()});
 cx.restore();
}

/* ---------------- scenes ---------------- */
const root=document.getElementById('scenes');
const SCN={};
function layer(id){const L=mk(root,'div','L');SCN[id]=L;return L}
const U=[];

/* INTRO */
{const L=layer('intro');
 mk(L,'div','',"",`<svg width="1920" height="1080"><g id="iring" transform="translate(960 470)"><circle r="400" fill="none" stroke="rgba(247,210,138,.35)" stroke-width="1.5" stroke-dasharray="2 10"/><circle id="iarc" r="440" fill="none" stroke="url(#ig)" stroke-width="3" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" transform="rotate(-90)"/></g><defs><linearGradient id="ig"><stop offset="0" stop-color="#f7d28a" stop-opacity="0"/><stop offset="1" stop-color="#ffe9b8"/></linearGradient></defs></svg>`);
 const kick=mk(L,'div','a ns',"font-size:26px;font-weight:500;color:#e8cf9a;letter-spacing:14px");kick.textContent='THE MIRACLE OF ONE MORE DAY';
 const title=mk(L,'div','a gb glow',"font-size:150px;letter-spacing:4px");const tc=chars(title,'하루가 더해지는 기적','gold');
 const line=mk(L,'div','a',"height:2px;width:760px;background:linear-gradient(90deg,transparent,#f7d28a,transparent)");
 const au=mk(L,'div','a gr',"font-size:46px;color:#f4ead6;letter-spacing:16px");au.textContent='송은영';
 const plus=mk(L,'div','a ns glow',"font-size:64px;font-weight:800;color:#ffe6b0");plus.textContent='+1';
 U.push(t=>{
  const r=document.getElementById('iarc');r.setAttribute('stroke-dashoffset',1000*(1-eio(P(t,.3,3.2))));document.getElementById('iring').setAttribute('transform',`translate(960 470) rotate(${t*6})`);
  place(kick,960,330,1,0,win(t,.6,30,1.2,1)*1,0);kick.style.letterSpacing=lerp(26,12,eo(P(t,.6,3)))+'px';
  place(title,960,470);tc.forEach((c,i)=>{const p=eo(P(t,1.2+i*.16,1.9+i*.16));c.style.opacity=p;c.style.transform=`translateY(${(1-p)*70}px) scale(${lerp(1.5,1,p)})`;c.style.filter=`blur(${(1-p)*14}px)`});
  place(line,960,585,1,0,P(t,3.2,3.6));line.style.width=eo(P(t,3.2,4.6))*760+'px';
  place(au,960,650,1,0,P(t,4.4,5.2),(1-P(t,4.4,5.2))*8);
  const pp=P(t,5.4,6.0);place(plus,1490,370,eback(pp),0,pp*(1-P(t,7,7.8)));
 });}

/* STINGERS */
const ST=[['winter','01','겨울','WINTER'],['breath','02','숨결','BREATH'],['confess','03','고백','CONFESSION'],['why','04','물음','QUESTION'],['miracle','05','깨달음','AWAKENING'],['embrace','06','하늘','SKY'],['love','07','사랑','LOVE']];
{const L=document.getElementById('sting');
 ST.forEach(([id,num,ko,en])=>{const g=mk(L,'div','a',"");
  const n=mk(g,'div','a ns',"font-size:230px;font-weight:900;color:transparent;-webkit-text-stroke:2px rgba(247,210,138,.75);letter-spacing:-6px");n.textContent=num;
  const k=mk(g,'div','a gb glow',"font-size:96px");const kc=chars(k,ko,'gold');
  const e=mk(g,'div','a ns',"font-size:24px;font-weight:600;color:#e8cf9a;letter-spacing:12px");e.textContent=en;
  const ln=mk(g,'div','a',"height:2px;background:linear-gradient(90deg,#f7d28a,transparent)");
  U.push(t=>{const s0=SC(id)+.15,s1=s0+(id==='miracle'?2.0:2.25);const a=win(t,s0,s1,.35,.5);g.style.opacity=a;if(a<=0)return;
   const ex=eio(P(t,s1-.5,s1))*120;const pi=eo(P(t,s0,s0+.7));
   place(n,lerp(640,760,pi)+ex*.5,470,1,0,pi*.9);
   kc.forEach((c,i)=>{const p=eo(P(t,s0+.2+i*.09,s0+.7+i*.09));c.style.opacity=p;c.style.transform=`translateY(${(1-p)*40}px)`});
   place(k,1090+ex,440);place(e,1090+ex,540,1,0,P(t,s0+.5,s0+1));e.style.letterSpacing=lerp(24,12,eo(P(t,s0+.5,s0+1.4)))+'px';
   place(ln,1000+ex,500,1,0,1);ln.style.width=eo(P(t,s0+.3,s0+1.1))*520+'px';ln.style.transform+=` translateX(${eo(P(t,s0+.3,s0+1.1))*260}px)`;
  })})}

/* WINTER */
{const L=layer('winter');
 const pain=mk(L,'div','a gr',"font-size:44px;color:#b9c8dd;letter-spacing:10px");pain.textContent='아픈 소식';
 const win_=mk(L,'div','a gb',"font-size:330px;color:#eaf4ff;letter-spacing:20px;text-shadow:0 0 40px rgba(150,200,255,.7),0 0 120px rgba(120,170,255,.45)");win_.textContent='겨울';
 const seasons=[['겨울',-90],['봄',0],['여름',90],['가을',180]];
 let svg=`<svg width="1920" height="1080"><g id="wdial" transform="translate(960 450)"><circle r="290" fill="none" stroke="rgba(220,235,255,.28)" stroke-width="2"/>`;
 for(let i=0;i<72;i++){const a=i*5*Math.PI/180,l=i%6?8:20;svg+=`<line x1="${Math.cos(a)*(300)}" y1="${Math.sin(a)*300}" x2="${Math.cos(a)*(300+l)}" y2="${Math.sin(a)*(300+l)}" stroke="rgba(220,235,255,.35)" stroke-width="2"/>`}
 svg+=`<circle id="warc" r="290" fill="none" stroke="#f7d28a" stroke-width="5" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" transform="rotate(-90)"/>`;
 seasons.forEach(([s,a],i)=>{svg+=`<g id="ws${i}" transform="rotate(${a}) translate(370 0)"><text class="gb" font-family="GB" font-size="58" text-anchor="middle" dominant-baseline="middle" fill="#dfe9f7">${s}</text></g>`});
 svg+=`</g></svg>`;const dl=mk(L,'div','',"",svg);
 const small=mk(L,'div','a gb glow',"font-size:62px");small.innerHTML='<span class="gold">작은 빛 하나</span>';
 U.push(t=>{
  const w1=W1(),w2=W2();
  place(pain,960,300,1,0,win(t,w1+.1,w1+2.2,.6,.6),0);pain.style.letterSpacing=lerp(4,14,P(t,w1,w1+2))+'px';
  const ap=P(t,w1+1.1,w1+1.6),shake=Math.sin(t*60)*16*(1-P(t,w1+1.1,w1+1.9))*(ap>0);
  place(win_,960+shake,430,lerp(1.5,1,eo(ap))*lerp(1,1.05,P(t,w1+1.6,w2)),0,ap*(1-P(t,w2-.1,w2+.6)),(1-ap)*20+P(t,w2-.1,w2+.6)*16);
  const dA=win(t,w2-.2,SE('winter')+.3,.9,.8);dl.style.opacity=dA;const rot=-90*eio(P(t,w2+.3,w2+2.6));
  document.getElementById('wdial').setAttribute('transform',`translate(960 450) scale(${lerp(.8,1,eo(P(t,w2-.2,w2+.8)))}) rotate(${rot})`);
