<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script>
// 설아의 초록빛 나들이 — 40초 유튜브 모션그래픽
const W = 1920, H = 1080, FPS = 30, DUR = TL.dur;
const ctx = document.getElementById('c').getContext('2d');
const TAU = Math.PI * 2;
const KR = '"WenQuanYi Zen Hei", "Noto Color Emoji", sans-serif';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
// 설아의 분홍 옷 + 공원의 초록
const C = { leaf: '#5cc46a', leafD: '#2f8f4a', mint: '#c9f2d6', pink: '#ff7eb6', pinkL: '#ffd6e8', sky: '#7cc8ff', yel: '#ffd34d', ink: '#24452f', white: '#ffffff' };
const POP = ['#ff5fa2', '#ffb03b', '#4cc35d', '#3fa9f5', '#a66bff'];
const scene = id => TL.scenes.find(s => s.id === id);
const line = id => TL.lines.find(l => l.id === id);
function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }
const PH = {}; let vImg = null;

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function txt(s, x, y, size, color, align = 'center', stroke = null, sw = 0.16, weight = 0.05) {
  ctx.font = `${size}px ${KR}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = size * sw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  if (weight) { ctx.lineWidth = size * weight; ctx.strokeStyle = color; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function leaf(x, y, s, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, -s); ctx.quadraticCurveTo(s * 0.75, -s * 0.2, 0, s); ctx.quadraticCurveTo(-s * 0.75, -s * 0.2, 0, -s); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = Math.max(1.5, s * 0.06); ctx.beginPath(); ctx.moveTo(0, -s * 0.85); ctx.lineTo(0, s * 0.85); ctx.stroke(); ctx.restore();
}
function heart(x, y, s, color) {
  ctx.beginPath(); y -= s * 0.5; ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y - s * 0.05, x - s * 0.5, y + s * 0.3); ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x - s * 0.1, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x + s * 0.1, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3); ctx.bezierCurveTo(x + s * 0.5, y - s * 0.05, x, y, x, y + s * 0.3);
  ctx.fillStyle = color; ctx.fill();
}

// ---------- 배경: 봄 공원 그라디언트 + 흩날리는 잎 ----------
const BG = { intro: ['#dff7e6', '#fff3c4'], res1: ['#e0f3ff', '#e3f9e8'], res2: ['#e6f6ff', '#fff0f6'], park1: ['#e3f9e8', '#fff6d0'], park2: ['#e3f9e8', '#fffbe0'], finale: ['#ffe8f3', '#e2f8e6'] };
function background(t, id) {
  const [a, b] = BG[id];
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, a); g.addColorStop(1, b); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 햇살 원
  const sg = ctx.createRadialGradient(W * 0.82, 120, 20, W * 0.82, 120, 620); sg.addColorStop(0, 'rgba(255,248,200,.9)'); sg.addColorStop(1, 'rgba(255,248,200,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  // 물방울 무늬
  ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = '#fff';
  for (let y = 0; y < H + 90; y += 90) for (let x = (y / 90) % 2 ? 45 : 0; x < W + 90; x += 90) { ctx.beginPath(); ctx.arc(x + (t * 14) % 90, y, 6, 0, TAU); ctx.fill(); }
  ctx.restore();
  // 바람에 날리는 잎
  for (let i = 0; i < 22; i++) {
    const sp = 0.05 + rnd(i) * 0.06, p = (t * sp + rnd(i + 7)) % 1;
    const x = W + 80 - p * (W + 200) + Math.sin(t * 1.3 + i) * 40, y = rnd(i * 3) * H + Math.sin(t * 0.9 + i * 2) * 60;
    ctx.save(); ctx.globalAlpha = 0.55; leaf(x, y, 16 + rnd(i + 2) * 22, t * (1 + rnd(i)) + i, i % 4 === 0 ? '#ffb3d1' : (i % 2 ? C.leaf : '#8ad86a')); ctx.restore();
  }
}

// ---------- 폴라로이드 카드 ----------
function card(img, cx, cy, w, h, rot, k, kb = 0, opts = {}) {
  if (!img || k <= 0) return;
  const s = opts.noPop ? clamp(k) : back(clamp(k));
  ctx.save(); ctx.globalAlpha *= clamp(k * 2); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s, s);
  const pad = opts.pad ?? 20, bottom = opts.label ? 78 : (opts.bottom ?? 20);
  ctx.shadowColor = 'rgba(30,80,40,.28)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#fff'; rrect(-w / 2 - pad, -h / 2 - pad, w + pad * 2, h + pad + bottom, 18); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.save(); rrect(-w / 2, -h / 2, w, h, 10); ctx.clip();
  const ir = img.width / img.height, cr = w / h; let dw = w, dh = h; if (ir > cr) dw = h * ir; else dh = w / ir;
  const z = 1.04 + kb * 0.12;
  const px = (opts.panX ?? 0) * (dw * z - w) * 0.5, py = (opts.panY ?? 0) * (dh * z - h) * 0.5;
  ctx.drawImage(img, -dw * z / 2 + px, -dh * z / 2 + py, dw * z, dh * z);
  ctx.restore();
  ctx.save(); ctx.rotate(-0.06); ctx.fillStyle = opts.tape || 'rgba(255,190,220,.88)'; ctx.fillRect(-85, -h / 2 - pad - 18, 170, 40); ctx.restore();
  if (opts.label) txt(opts.label, 0, h / 2 + 56, 40, C.ink, 'center', null, 0, 0.04);
  ctx.restore();
}
const inout = (t, a, b, fi = 0.45, fo = 0.35) => Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b));
// 장면 시작 순간 화면이 '쿵' 하고 살짝 확대되는 펀치
function punch(t) { let z = 1; for (const s of TL.scenes.slice(1)) { const d = t - s.t; if (d >= 0 && d < 0.4) z += 0.035 * Math.sin(d / 0.4 * Math.PI); } return z; }

// ---------- 칩 / 자막 / 효과 ----------
function chip(t, sc, emoji, label, color) {
  const k = prog(t, sc.t + 0.3, sc.t + 0.75), out = prog(t, sc.e - 0.45, sc.e - 0.1);
  if (k <= 0 || out >= 1) return;
  ctx.save(); ctx.globalAlpha = 1 - out;
  ctx.font = `40px ${KR}`; const tw = ctx.measureText(label).width, w = tw + 120, x = 44, y = 30;
  ctx.translate(x + w / 2, y + 37); ctx.scale(back(k), back(k)); ctx.rotate(-0.03 + Math.sin(t * 2.4) * 0.012); ctx.translate(-(x + w / 2), -(y + 37));
  ctx.shadowColor = 'rgba(0,0,0,.15)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6; ctx.fillStyle = color; rrect(x, y, w, 74, 37); ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  txt(emoji, x + 48, y + 52, 40, '#fff', 'center', null, 0, 0); txt(label, x + 88, y + 52, 40, '#fff', 'left', 'rgba(0,0,0,.12)', 0.08, 0.05);
  ctx.restore();
}
function subtitles(t) {
  const l = TL.lines.find(l => t >= l.t - 0.1 && t < l.e + 0.3); if (!l) return;
  const a = Math.min(prog(t, l.t - 0.1, l.t + 0.12), 1 - prog(t, l.e + 0.12, l.e + 0.3));
  const size = 50; ctx.font = `${size}px ${KR}`; const w = ctx.measureText(l.text).width + 90, h = 92, y0 = H - 54 - h;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, y0 + h / 2); const s = 0.9 + 0.1 * back(prog(t, l.t - 0.1, l.t + 0.25)); ctx.scale(s, s); ctx.translate(-W / 2, -(y0 + h / 2));
  ctx.fillStyle = 'rgba(36,69,47,.82)'; rrect(W / 2 - w / 2, y0, w, h, 46); ctx.fill();
  txt(l.text, W / 2, y0 + 63, size, '#fff', 'center', null, 0, 0.035); ctx.restore();
}
function bounceTitle(t, t0, s, y, size, gap = 0.06) {
  const chars = [...s]; ctx.font = `${size}px ${KR}`; const ws = chars.map(c => ctx.measureText(c).width), total = ws.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2;
  chars.forEach((ch, i) => {
    const k = prog(t, t0 + i * gap, t0 + 0.42 + i * gap);
    if (k > 0 && ch !== ' ') {
      const sc = back(k), bob = Math.sin(t * 5 + i) * 7 * prog(t, t0 + 0.8, t0 + 1.2);
      ctx.save(); ctx.translate(x + ws[i] / 2, y + bob - (1 - sc) * 120); ctx.scale(sc, sc); ctx.rotate(Math.sin(i * 1.7) * 0.07);
      txt(ch, 0, 0, size, POP[i % 5], 'center', '#fff', 0.2, 0.06); ctx.restore();
    }
    x += ws[i];
  });
}
function confetti(t, t0, n = 120, seed = 0) {
  const d = t - t0; if (d < 0 || d > 3) return;
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (rnd(i + seed) - 0.5) * 2.4, sp = 900 + rnd(i * 3 + seed) * 900;
    const x = W / 2 + Math.cos(ang) * sp * d, y = H * 0.55 + Math.sin(ang) * sp * d + 900 * d * d;
    ctx.save(); ctx.globalAlpha = 1 - d / 3; ctx.translate(x, y); ctx.rotate(d * (6 + rnd(i) * 8));
    if (i % 3 === 0) leaf(0, 0, 18, 0, i % 2 ? C.leaf : '#8ad86a'); else if (i % 3 === 1) heart(0, 0, 22, POP[i % 5]); else { ctx.fillStyle = POP[i % 5]; ctx.fillRect(-9, -5, 18, 10); }
    ctx.restore();
  }
}
// 장면 전환: 커다란 잎 두 장이 화면을 쓸고 지나감
function leafWipe(t) {
  for (const s of TL.scenes.slice(1)) {
    const d = t - s.t; if (d < -0.38 || d > 0.38) continue;
    const k = (d + 0.38) / 0.76;
    const x = lerp(W + 1300, -1300, eio(k));
    ctx.save(); leaf(x, H / 2, 1250, Math.PI / 2 + 0.25, C.leaf); leaf(x + 380, H / 2 + 90, 900, Math.PI / 2 + 0.4, '#8ad86a'); ctx.restore();
  }
}
function pill(t, t0, s, x, y, color) {
  const k = prog(t, t0, t0 + 0.35); if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); const sc = back(k) * (1 + 0.03 * Math.sin(t * 6 + x)); ctx.scale(sc, sc); ctx.rotate(Math.sin(t * 2 + x) * 0.04);
  ctx.font = `52px ${KR}`; const w = ctx.measureText(s).width + 70;
  ctx.shadowColor = 'rgba(0,0,0,.15)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6; ctx.fillStyle = color; rrect(-w / 2, -48, w, 96, 48); ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  txt(s, 0, 18, 52, '#fff', 'center', null, 0, 0.05); ctx.restore();
}
function sparkles(t, x, y, r, k) {
  for (let i = 0; i < 10; i++) {
    const tw = Math.max(0, Math.sin(t * 4 + i * 1.7)); if (tw <= 0) continue;
    const a = i / 10 * TAU + t * 0.3, sx = x + Math.cos(a) * r * (0.8 + rnd(i) * 0.4), sy = y + Math.sin(a) * r * 0.8;
    ctx.save(); ctx.globalAlpha = k * tw; ctx.translate(sx, sy); ctx.fillStyle = '#fff6b0'; ctx.beginPath();
    for (let q = 0; q < 8; q++) { const rr = q % 2 ? 6 : 22, aa = q / 8 * TAU; ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
}

// ---------- 영상 프레임 ----------
const VTOTAL = 830;
async function vframe(sec) {
  const idx = Math.min(VTOTAL, Math.max(1, Math.floor(sec * FPS) + 1));
  const src = `clips/v/f${String(idx).padStart(4, '0')}.jpg`;
  if (!vImg || vImg._src !== src) { const im = await loadImg(src); if (im) { im._src = src; vImg = im; } }
  return vImg;
}

// ================= 장면 =================
// 지도 핀
function pin(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.2)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, -46, 34, Math.PI, 0); ctx.quadraticCurveTo(34, -16, 0, 0); ctx.quadraticCurveTo(-34, -16, -34, -46); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -46, 13, 0, TAU); ctx.fill(); ctx.restore();
}
// 장소 이름: 가운데서 크게 튀어나왔다가 오른쪽 위로 자리 잡음
function placeTag(t, t0, name, color, end) {
  const k = prog(t, t0, t0 + 0.4), dock = eio(prog(t, t0 + 1.3, t0 + 1.8)), out = prog(t, end - 0.45, end - 0.1);
  if (k <= 0 || out >= 1) return;
  const x = lerp(W / 2, W - 300, dock), y = lerp(H / 2 - 20, 70, dock), sc = lerp(1, 0.5, dock) * back(k);
  ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate(Math.sin(t * 2.2) * 0.015);
  if (dock < 1) { ctx.save(); ctx.globalAlpha *= (1 - dock) * 0.9; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(-W, -H, W * 2, H * 2); ctx.restore(); }
  ctx.font = `92px ${KR}`; const w = ctx.measureText(name).width + 220;
  ctx.shadowColor = 'rgba(0,0,0,.18)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10; ctx.fillStyle = '#fff'; rrect(-w / 2, -80, w, 160, 80); ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = color; ctx.lineWidth = 8; rrect(-w / 2, -80, w, 160, 80); ctx.stroke();
  pin(-w / 2 + 92, 48, 1.15, color);
  txt(name, 46, 32, 92, color, 'center', null, 0, 0.05);
  ctx.restore();
}
function ripples(t, x, y, k) {
  for (let i = 0; i < 4; i++) {
    const p = (t * 0.5 + i / 4) % 1;
    ctx.save(); ctx.globalAlpha = k * (1 - p) * 0.6; ctx.strokeStyle = '#7cc8ff'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(x, y, 40 + p * 220, (40 + p * 220) * 0.28, 0, 0, TAU); ctx.stroke(); ctx.restore();
  }
}
async function sIntro(t) {
  const im = await vframe(20 + t);
  card(im, 1500, 520, 380, 676, 0.07 + Math.sin(t * 1.2) * 0.01, prog(t, 0.15, 0.6), 0, { tape: 'rgba(255,211,77,.9)' });
  card(PH.p6, 420, 540, 400, 533, -0.08 + Math.sin(t) * 0.01, prog(t, 0.35, 0.8), prog(t, 0, 5.2), { tape: 'rgba(124,200,255,.85)', panY: -0.1 });
  bounceTitle(t, 0.5, '설아의', 420, 110);
  bounceTitle(t, 0.85, '초록빛 나들이', 600, 160);
  const k = prog(t, 2.0, 2.5);
  if (k > 0) { ctx.save(); ctx.globalAlpha = k; ctx.translate(W / 2, 700); ctx.scale(back(k), back(k)); ctx.fillStyle = '#fff'; rrect(-300, -42, 600, 84, 42); ctx.fill(); txt('👴 할아버지 · 할머니와 함께 👵', 0, 16, 42, C.leafD, 'center', null, 0, 0.04); ctx.restore(); }
  confetti(t, 0.9, 120, 3);
}
function sRes1(t) {
  const sc = scene('res1'), l = line('n02'), p = prog(t, sc.t, sc.e);
  const k = inout(t, sc.t + 0.9, sc.e);
  ripples(t, 1350, 760, k);
  card(PH.p6, lerp(-400, 760, eout(prog(t, sc.t + 0.9, sc.t + 1.5))), 450, 560, 746, -0.04 + Math.sin(t * 0.9) * 0.01, k, p, { panY: lerp(-0.25, 0.2, p), label: '할아버지 손 꼭 잡고', tape: 'rgba(124,200,255,.85)', noPop: true });
  // 손잡은 하트가 오른쪽으로 걸어가듯 통통
  for (let i = 0; i < 9; i++) {
    const st = l.t + 1.6 + i * 0.28, d = t - st; if (d < 0 || d > 1.5) continue;
    ctx.save(); ctx.globalAlpha = 1 - d / 1.5; heart(1180 + i * 60 + d * 80, 560 - Math.abs(Math.sin(d * 5)) * 90 - d * 120, 52, POP[i % 5]); ctx.restore();
  }
  const fk = prog(t, l.t + 1.8, l.t + 2.3);
  if (fk > 0) { ctx.save(); ctx.globalAlpha = fk * (1 - prog(t, sc.e - 0.4, sc.e - 0.1)); txt('👣  사뿐사뿐', 1420, 420, 64, C.leafD, 'center', '#fff', 0.18, 0.05); ctx.restore(); }
  placeTag(t, sc.t + 0.05, '양주 기산 저수지', '#3fa9f5', scene('res2').e);
}
function sRes2(t) {
  const sc = scene('res2'), l = line('n03'), p = prog(t, sc.t, sc.e);
  const k1 = inout(t, sc.t + 0.1, sc.e), k2 = inout(t, l.t + 1.9, sc.e);
  card(PH.p9, lerp(-400, 560, eout(prog(t, sc.t + 0.05, sc.t + 0.6))), 455, 500, 666, -0.05 + Math.sin(t * 0.8) * 0.01, k1, p, { panY: 0.15, label: '할머니 품에서 까르르', tape: 'rgba(255,126,182,.85)', noPop: true });
  card(PH.p10, 1340, 430, 640, 480, 0.04 + Math.sin(t * 0.9) * 0.008, k2, p, { label: '송은영 원장 선생님과 함께', tape: 'rgba(255,211,77,.9)' });
  for (let i = 0; i < 6; i++) {
    const st = l.t + 0.5 + i * 0.25, d = t - st; if (d < 0 || d > 1.3) continue;
    ctx.save(); ctx.globalAlpha = 1 - d / 1.3; txt(['하', '하', '호', '호', '♪', '♥'][i], 860 + i * 40, 300 - d * 200, 60, POP[i % 5], 'center', '#fff', 0.18, 0.05); ctx.restore();
  }
  sparkles(t, 1340, 420, 380, k2 * 0.8);
}
async function sPark1(t) {
  const sc = scene('park1'), l = line('n04');
  // 저수지 → 조각공원 이동 경로
  const rk = prog(t, sc.t + 0.1, sc.t + 1.4), rOut = prog(t, sc.t + 1.6, sc.t + 2.0);
  if (rOut < 1) {
    ctx.save(); ctx.globalAlpha = 1 - rOut;
    const ax = 460, ay = 640, bx = 1460, by = 420;
    ctx.setLineDash([22, 18]); ctx.lineWidth = 10; ctx.strokeStyle = '#ffb03b'; ctx.lineCap = 'round';
    ctx.beginPath(); for (let i = 0; i <= 40 * rk; i++) { const q = i / 40, x = lerp(ax, bx, q), y = lerp(ay, by, q) - Math.sin(q * Math.PI) * 220; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.setLineDash([]);
    pin(ax, ay, 1.3, '#3fa9f5'); txt('기산 저수지', ax, ay + 70, 46, '#3fa9f5', 'center', '#fff', 0.2, 0.05);
    const q = eio(rk), cx = lerp(ax, bx, q), cy = lerp(ay, by, q) - Math.sin(q * Math.PI) * 220;
    ctx.save(); ctx.translate(cx, cy - 10); ctx.scale(-1, 1); txt('🚗', 0, 0, 90, '#000', 'center', null, 0, 0); ctx.restore();
    if (rk >= 1) { const pk = back(prog(t, sc.t + 1.4, sc.t + 1.7)); ctx.save(); ctx.translate(bx, by); ctx.scale(pk, pk); pin(0, 0, 1.3, '#4cc35d'); ctx.restore(); txt('장흥 조각공원', bx, by + 70, 46, '#2f8f4a', 'center', '#fff', 0.2, 0.05); }
    ctx.restore();
  }
  const k = inout(t, sc.t + 1.9, sc.e);
  const im = await vframe(t - sc.t - 1.9 + 0.5);
  card(im, 980, 470, 430, 764, Math.sin(t * 1.6) * 0.015, k, 0, { tape: 'rgba(198,232,107,.95)' });
  // 뛰노는 리듬: 양옆에서 통통 튀는 아이콘
  const ik = prog(t, l.t + 0.8, l.t + 1.2) * (1 - prog(t, sc.e - 0.4, sc.e - 0.1));
