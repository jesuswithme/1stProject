const DATA=__TL__;

// ---------- helpers
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>1-Math.pow(1-x,3);
const eo5=x=>1-Math.pow(1-x,5);
const ei=x=>x*x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const win=(t,a,b,fi=.6,fo=.6)=>Math.min(P(t,a,a+fi),1-P(t,b-fo,b));
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const root=document.getElementById('root');
function mk(tag,cls,parent,css,html){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;(parent||root).appendChild(e);return e}
function layer(z){return mk('div','L',root,`z-index:${z}`)}
// text with [gold] markup split into chars
function T(parent,text,css,goldColor){
  const e=mk('div','c',parent,css);e._ch=[];let g=false;
  for(const chr of text){ if(chr==='['){g=true;continue} if(chr===']'){g=false;continue}
    const s=document.createElement('span');s.className='ch';s.textContent=chr;if(g)s.style.color=goldColor||'var(--gold)';e.appendChild(s);e._ch.push(s);}
  e.style.opacity=0;return e}
function reveal(e,p,spread=.55,dy=26,blur=10){const n=e._ch.length;
  for(let i=0;i<n;i++){const lp=cl((p-(i/n)*spread)/(1-spread));const q=eo(lp);const s=e._ch[i];
    s.style.opacity=q;s.style.transform=`translateY(${(1-q)*dy}px)`;s.style.filter=lp<1?`blur(${(1-q)*blur}px)`:'none';}}
function show(e,t,a,b,dur=1.0,fo=.6,opts={}){ // reveal at a, fade out ending at b
  if(t<a-.05||t>b){e.style.opacity=0;return 0}
  const o=1-P(t,b-fo,b);e.style.opacity=o;reveal(e,P(t,a,a+dur),opts.spread??.55,opts.dy??26,opts.blur??10);return o}
const setO=(e,o)=>{e.style.opacity=o;e.style.visibility=o<=0.001?'hidden':'visible'};

// ---------- value noise for textures
function noise2(seed){const r=rng(seed);const G=256;const v=new Float32Array(G*G);for(let i=0;i<G*G;i++)v[i]=r();
  const sm=x=>x*x*(3-2*x);
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const a=xi&255,b=yi&255,a1=(a+1)&255,b1=(b+1)&255;
    const u=sm(xf),w=sm(yf);const v00=v[b*G+a],v10=v[b*G+a1],v01=v[b1*G+a],v11=v[b1*G+a1];
    return lerp(lerp(v00,v10,u),lerp(v01,v11,u),w)}}
const N1=noise2(7),N2=noise2(19),N3=noise2(41);
const fbm=(n,x,y)=>n(x,y)*.55+n(x*2.03,y*2.03)*.28+n(x*4.1,y*4.1)*.17;

// ---------- door texture (800x1100, arched)
const DW=800,DH=1100,AR=400;
function drawDoor(){
  const cv=document.createElement('canvas');cv.width=DW;cv.height=DH;const g=cv.getContext('2d');
  const img=g.createImageData(DW,DH);const d=img.data;const PL=5,pw=DW/PL;
  for(let y=0;y<DH;y++)for(let x=0;x<DW;x++){
    const pi=Math.floor(x/pw),lx=x-pi*pw;
    const u=x+fbm(N1,x*.006+pi*3.1,y*.0016)*70;
    const ring=Math.sin(u*.21+fbm(N2,x*.012,y*.004+pi)*7.0);
    const streak=fbm(N3,x*.09,y*.006+pi*5);
    const pl=0.85+0.3*N2(pi*7.3,1.7);
    let k=(0.42+0.10*ring+0.42*(streak-.5)+0.18*(fbm(N1,x*.03,y*.0009+pi*2)-.5))*pl;
    // knots
    if(lx<4||lx>pw-4)k*=0.25; else if(lx<9||lx>pw-9)k*=0.7;
    k=cl(k,0.05,1.2);
    const i=(y*DW+x)*4;d[i]=30+k*95;d[i+1]=18+k*62;d[i+2]=10+k*34;d[i+3]=255;}
  g.putImageData(img,0,0);
  // iron straps
  for(const yy of [250,560,870]){const hh=54;
    const gr=g.createLinearGradient(0,yy,0,yy+hh);gr.addColorStop(0,'#3a3836');gr.addColorStop(.5,'#232120');gr.addColorStop(1,'#141312');
    g.fillStyle=gr;g.fillRect(0,yy,DW,hh);
    for(let x=0;x<DW;x+=2){g.fillStyle=`rgba(${120+N1(x*.05,yy)*60},${80+N1(x*.05,yy)*30},40,${N2(x*.03,yy*.1)*.25})`;g.fillRect(x,yy+Math.floor(N3(x*.07,yy)*hh),2,3)}
    for(let x=40;x<DW;x+=80){const rg=g.createRadialGradient(x-3,yy+hh/2-3,1,x,yy+hh/2,10);rg.addColorStop(0,'#8a8580');rg.addColorStop(1,'#1a1918');g.fillStyle=rg;g.beginPath();g.arc(x,yy+hh/2,9,0,7);g.fill()}}
  // ring handle
  g.save();g.translate(640,640);g.strokeStyle='#2c2a28';g.lineWidth=14;g.beginPath();g.arc(0,40,46,0,7);g.stroke();
  g.strokeStyle='rgba(160,150,135,.35)';g.lineWidth=3;g.beginPath();g.arc(-3,37,48,3.6,5.4);g.stroke();
  g.fillStyle='#1d1c1b';g.beginPath();g.arc(0,-6,26,0,7);g.fill();g.restore();
  // lighting: warm key from upper-left + vignette
  let lg=g.createRadialGradient(DW*.32,DH*.3,40,DW*.45,DH*.5,DH*.85);lg.addColorStop(0,'rgba(255,200,130,0.18)');lg.addColorStop(.5,'rgba(0,0,0,0)');lg.addColorStop(1,'rgba(0,0,0,0.7)');
  g.fillStyle=lg;g.fillRect(0,0,DW,DH);

  g.globalCompositeOperation='destination-in';g.fillStyle='#000';g.beginPath();g.moveTo(0,DH);g.lineTo(0,AR);g.arc(DW/2,AR,DW/2,Math.PI,0);g.lineTo(DW,DH);g.closePath();g.fill();

  g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=16;g.beginPath();g.moveTo(0,DH);g.lineTo(0,AR);g.arc(DW/2,AR,DW/2,Math.PI,0);g.lineTo(DW,DH);g.stroke();
  return cv;}
function drawFrame(){ // stone arch frame + wall, world 1920x1080 coords, door at (560,-10)
  const cv=document.createElement('canvas');cv.width=2400;cv.height=1500;const g=cv.getContext('2d');

    const by=Math.floor((y+3)/90),bx=Math.floor((x+(by%2)*110)/220);const mortar=((y+3)%90<4)||(((x+(by%2)*110)%220)<4);

  g.putImageData(img,0,0);

  g.save();g.lineWidth=90;g.strokeStyle='#4a4540';g.beginPath();g.moveTo(x0-45,y0+DH+60);g.lineTo(x0-45,y0+AR);g.arc(x0+DW/2,y0+AR,DW/2+45,Math.PI,0);g.lineTo(x0+DW+45,y0+DH+60);g.stroke();
  // voussoir lines
  g.lineWidth=3;g.strokeStyle='rgba(0,0,0,.5)';for(let a=0;a<=12;a++){const th=Math.PI+a*Math.PI/12;g.beginPath();g.moveTo(x0+DW/2+Math.cos(th)*(DW/2),y0+AR+Math.sin(th)*(DW/2));g.lineTo(x0+DW/2+Math.cos(th)*(DW/2+90),y0+AR+Math.sin(th)*(DW/2+90));g.stroke()}
  for(let yy=y0+AR;yy<y0+DH+60;yy+=110){for(const xx of [x0-90,x0+DW]){g.beginPath();g.moveTo(xx,yy);g.lineTo(xx+90,yy);g.stroke()}}
  g.restore();
  // stone texture over frame
  g.globalCompositeOperation='overlay';g.fillStyle='rgba(120,110,100,.25)';g.fillRect(0,0,2400,1500);g.globalCompositeOperation='source-over';
  // wall light falloff
  const lg=g.createRadialGradient(ox+960,oy+520,100,ox+960,oy+540,1300);lg.addColorStop(0,'rgba(0,0,0,0)');lg.addColorStop(1,'rgba(0,0,0,.9)');g.fillStyle=lg;g.fillRect(0,0,2400,1500);
  // doorway hole (transparent) so light can show behind
  g.globalCompositeOperation='destination-out';g.fillStyle='#000';g.beginPath();g.moveTo(x0,y0+DH);g.lineTo(x0,y0+AR);g.arc(x0+DW/2,y0+AR,DW/2,Math.PI,0);g.lineTo(x0+DW,y0+DH);g.closePath();g.fill();g.globalCompositeOperation='source-over';
  return cv;}

const bloom=mk('div','',Ldoor,'position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse at 50% 52%,#fff8ea 0%,#ffe6ad 45%,#e8b357 100%);opacity:0');
const rays=mk('div','',Ldoor,'position:absolute;left:-480px;top:-960px;width:2880px;height:2880px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,240,200,.16) 0deg 4deg,rgba(255,240,200,0) 4deg 11deg);opacity:0;mix-blend-mode:screen');
const doorDim=mk('div','',Ldoor,'position:absolute;left:0;top:0;width:1920px;height:1080px;background:#0d0c0b;opacity:0');

// ---------- particles / grain
const fx=mk('canvas','',Lfx);fx.width=W;fx.height=H;const fg=fx.getContext('2d');
const grainCv=mk('canvas','',Ltop,'width:1920px;height:1080px;opacity:.07;mix-blend-mode:overlay');grainCv.width=480;grainCv.height=270;const gg=grainCv.getContext('2d');
const grains=[];{const r=rng(5);for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=480;c.height=270;const x=c.getContext('2d');const im=x.createImageData(480,270);for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);grains.push(c)}}
const vign=mk('div','',Ltop,'position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)');
const black=mk('div','',Ltop,'position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000;opacity:1');
const motes=[];{const r=rng(11);for(let i=0;i<170;i++)motes.push({x:r(),y:r(),z:.3+r()*.7,ph:r()*6.28,sp:.2+r()*.8})}
const burst=[];{const r=rng(23);for(let i=0;i<40;i++)burst.push({a:r()*6.28,v:120+r()*420,s:1+r()*2.5,g:r()})}

// ================= SCENE 1: CHAOS =================
const s1bg=mk('div','',Ls1,'position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse at 50% 50%,#1b1a19,#070707 75%)');
const ICON=[
 // phone
 `<rect x="62" y="18" width="76" height="164" rx="14"/><rect x="72" y="36" width="56" height="118" rx="3" class="f"/><circle cx="100" cy="166" r="5"/>`,
 // city
 `<path d="M10 180 V110 H40 V70 H62 V120 H80 V40 H112 V130 H128 V90 H150 V60 H172 V120 H190 V180 Z"/><path d="M88 55h16M88 70h16M88 85h16M88 100h16M156 75h10M156 90h10M48 85h8M48 100h8" />`,
 // AI network
 `<circle cx="30" cy="50" r="8"/><circle cx="30" cy="100" r="8"/><circle cx="30" cy="150" r="8"/><circle cx="100" cy="35" r="8"/><circle cx="100" cy="80" r="8"/><circle cx="100" cy="125" r="8"/><circle cx="100" cy="170" r="8"/><circle cx="170" cy="75" r="8"/><circle cx="170" cy="125" r="8"/><path d="M38 50L92 35M38 50L92 80M38 100L92 80M38 100L92 125M38 150L92 125M38 150L92 170M38 50L92 125M108 35L162 75M108 80L162 75M108 125L162 125M108 170L162 125M108 80L162 125"/>`,
 // family table
 `<path d="M20 120 H180 M40 120 V180 M160 120 V180"/><circle cx="60" cy="70" r="16"/><path d="M38 118 Q60 86 82 118"/><circle cx="140" cy="70" r="16"/><path d="M118 118 Q140 86 162 118"/><circle cx="100" cy="88" r="11"/><path d="M85 118 Q100 98 115 118"/>`,
 // empty sanctuary
 `<path d="M70 20 Q100 -5 130 20 V80 H70 Z"/><path d="M100 10 V80 M70 50 H130"/><path d="M20 110 H85 M115 110 H180 M20 135 H85 M115 135 H180 M20 160 H85 M115 160 H180 M20 185 H85 M115 185 H180"/>`,
 // hands: child & elder
 `<rect x="12" y="78" width="70" height="56" rx="16"/><rect x="80" y="80" width="46" height="13" rx="6"/><rect x="80" y="96" width="52" height="13" rx="6"/><rect x="80" y="112" width="48" height="13" rx="6"/><rect x="78" y="127" width="38" height="12" rx="6"/><rect x="146" y="92" width="34" height="28" rx="9"/><rect x="128" y="94" width="22" height="7" rx="3.5"/><rect x="126" y="103" width="24" height="7" rx="3.5"/><rect x="128" y="112" width="22" height="7" rx="3.5"/>`,
 // person looking at phone
 `<circle cx="100" cy="52" r="24"/><path d="M48 185 Q50 110 100 104 Q150 110 152 185"/><rect x="82" y="128" width="36" height="52" rx="6" class="f"/>`,
 // speech bubbles
 `<path d="M20 40 H120 Q132 40 132 52 V92 Q132 104 120 104 H60 L40 124 V104 H32 Q20 104 20 92 V52 Q20 40 32 40 Z"/><path d="M180 100 H96 Q86 100 86 110 V146 Q86 156 96 156 H150 L166 172 V156 H170 Q180 156 180 146 Z"/><circle cx="56" cy="72" r="4"/><circle cx="76" cy="72" r="4"/><circle cx="96" cy="72" r="4"/>`
];
const flashes=[];{const r=rng(3);let t=1.4;let k=0;while(t<29.75){const p=t/30;const gap=lerp(1.45,.26,Math.pow(p,1.1));
  const side=r();let x=side<.5?lerp(180,700,r()):lerp(1220,1740,r());let y=lerp(170,910,r());if(r()<.25){x=lerp(300,1620,r());y=r()<.5?lerp(140,300,r()):lerp(800,940,r())}
  flashes.push({t,d:gap*2.1,ic:(k*5+Math.floor(r()*3))%ICON.length,x,y,s:lerp(1.1,2.3,r()),rot:lerp(-8,8,r()),gold:r()<.25,dx:lerp(-30,30,r())});t+=gap;k++}}
const flashEls=flashes.map(f=>{const e=mk('div','',Ls1,`position:absolute;left:${f.x-100}px;top:${f.y-100}px;width:200px;height:200px;opacity:0`);

const waveSvg=mk('div','',Ls1,'position:absolute;left:0;top:0;width:1920px;height:1080px');waveSvg.innerHTML='<svg width="1920" height="1080" style="position:absolute;left:0;top:0"><g id="wv" fill="none" stroke-width="1.6"></g></svg>';
const wv=waveSvg.querySelector('#wv');const wpaths=[];for(let i=0;i<7;i++){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('stroke',i%3==0?'rgba(227,174,60,.35)':'rgba(220,214,200,.22)');wv.appendChild(p);wpaths.push(p)}
const s1scrim=mk('div','',Ls1,'position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse 50% 22% at 50% 50%,rgba(8,8,8,.85),rgba(8,8,8,0));opacity:0');
const C1=T(Ls1,'세상은 [빠르게] 변하고 있습니다.','font-size:74px;color:#F4EFE4;font-family:"WenQuanYi Zen Hei";font-weight:700');

const C3=T(Ls1,'무엇은 다시 [개혁]되어야 합니까?','font-size:80px;color:#F4EFE4;font-family:"WenQuanYi Zen Hei";font-weight:700');
function scene1(t){
  const on=t<30;setO(Ls1,on?1:0);if(!on)return;
  const amp=8+70*Math.pow(t/30,2.2);
  for(let i=0;i<wpaths.length;i++){let d='';const yb=540+(i-3)*34;for(let x=0;x<=1920;x+=24){const y=yb+Math.sin(x*.006+t*(1.3+i*.37)+i)*amp*.5*Math.sin(x*.0017+i)+Math.sin(x*.031+t*(4+i))*amp*.25*N1(x*.01+t*2,i*3.3);d+=(x?'L':'M')+x+' '+y.toFixed(1)}wpaths[i].setAttribute('d',d)}
  waveSvg.style.opacity=cl(t/3)*.9*(1-P(t,29.7,30));
  const txtOn=Math.max(win(t,6.6,13.8,.6,.8),win(t,14.1,21.2,.6,.8),win(t,21.1,30,.6,.2));
  s1scrim.style.opacity=txtOn;
  flashes.forEach((f,i)=>{const e=flashEls[i];const lp=(t-f.t)/f.d;if(lp<0||lp>1){e.style.opacity=0;return}
    const env=Math.min(lp/.12,1)*Math.min((1-lp)/.25,1);const flick=.75+.25*Math.sin(t*53+i*7);

// ================= particles =================
function particles(t,cam){
  fg.clearRect(0,0,W,H);
  // dust in door light
  let a=0;if(t>30.5&&t<55.5)a=win(t,30.5,55.5,1.5,.8)*.5;else if(t>55&&t<90)a=.18*win(t,55,90,1,1);else if(t>130&&t<170)a=.12*win(t,130,170,2,2);else if(t>209.5&&t<247)a=win(t,209.5,247,2,1.5)*(t>221?.55:.4);
  if(a>0){const warm=t>214;for(let i=0;i<motes.length;i++){const m=motes[i];
      let x=((m.x+t*.006*m.sp+.02*Math.sin(t*.4+m.ph))%1+1)%1*W,y=((m.y-t*.012*m.sp*(warm?2:1)+.02*Math.cos(t*.3+m.ph))%1+1)%1*H;
      const tw=.5+.5*Math.sin(t*1.7+m.ph*3);const r=(1+2.2*m.z)*(t>221?1.4:1);
      fg.fillStyle=t>221?`rgba(200,140,40,${a*tw*m.z})`:`rgba(255,${warm?226:214},${warm?170:160},${a*tw*m.z})`;fg.beginPath();fg.arc(x,y,r,0,7);fg.fill()}}
  // impact bursts
  for(const k of SFX.knock){const d=t-k;if(d<0||d>1.6)continue;
    const big=k<40||k>200;const ix=960+(960-cam.cx)*cam.s,iy=540+(680-cam.cy)*cam.s;
    const fl=Math.exp(-d*9);const rg=fg.createRadialGradient(ix,iy,0,ix,iy,big?520:300);rg.addColorStop(0,`rgba(255,215,150,${(big?.32:.16)*fl})`);rg.addColorStop(1,'rgba(255,215,150,0)');fg.fillStyle=rg;fg.fillRect(0,0,W,H);
    if(k>=55&&k<90)continue;
    burst.forEach(b=>{const r=b.v*(1-Math.exp(-d*3))*.9;const x=ix+Math.cos(b.a)*r,y=iy+Math.sin(b.a)*r*.7+d*d*60;const o=(1-d/1.6)*.7;fg.fillStyle=`rgba(230,205,160,${o})`;fg.beginPath();fg.arc(x,y,b.s,0,7);fg.fill()});
    // ring
    fg.strokeStyle=`rgba(255,220,160,${.4*Math.exp(-d*4)})`;fg.lineWidth=2;fg.beginPath();fg.arc(ix,iy,40+d*420,0,7);fg.stroke();}
}
