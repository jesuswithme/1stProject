const TAU = Math.PI * 2;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

// ---------- 공통 ----------

// 내레이션에 맞춰 나타났다 사라지는 정도 (0..1) 와 떠오름
function vis(t, id, hold = 1.2, fi = 0.6, fo = 0.7) {

// ---------- 나무 문 텍스처 (한 번만 그림) ----------

function digitRoll(t, a, b, x, y, size, k) { // 1517 → 2026 자릿수 회전
  const from = String(a), to = String(b);
  ctx.save(); ctx.font = `bold ${size}px ${SERIF}`;
  const cw = size * 0.62;
