<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<img id="logo" src="wcrc_logo.png" style="display:none">
<script src="timeline.js"></script>
<script>
// 2026 종교개혁주일 오프닝 영상 — "개혁은 아직 끝나지 않았다"
// CHAOS 0–30 / KNOCK 30–55 / CONFESSION 55–100 / REFORM 100–128 / DISCERN 128–162 / FORMATION 162–198 / OPEN DOOR 198–240
const W = 1920, H = 1080, DUR = TL.dur;
const ctx = document.getElementById('c').getContext('2d');
const logo = document.getElementById('logo');
const TAU = Math.PI * 2;
const KR = '"WenQuanYi Zen Hei", sans-serif';
const SERIF = '"Liberation Serif", "DejaVu Serif", serif';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const ein = x => x * x * x;
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
// WCRC 골드 + 차콜 + 아이보리
const C = { gold: '#d6a53a', goldL: '#f0cd7a', char: '#1e1d1b', char2: '#2a2826', ivory: '#f4efe4', ivoryD: '#cfc6b4', ink: '#2b2925', wood: '#4a301c' };
const L = Object.fromEntries(TL.lines.map(l => [l.id, l]));

// ---------- 공통 ----------
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function glow(x, y, r, color, a) {
  if (a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function kText(s, x, y, size, color, align = 'center', weight = 0.045) {
  ctx.font = `${size}px ${KR}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = '0px'; ctx.lineJoin = 'round';
  if (weight) { ctx.lineWidth = size * weight; ctx.strokeStyle = color; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function sText(s, x, y, size, color, align = 'center', spacing = 0.18, bold = false) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${SERIF}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.letterSpacing = `${size * spacing}px`; ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.letterSpacing = '0px';
}
// 내레이션에 맞춰 나타났다 사라지는 정도 (0..1) 와 떠오름
function vis(t, id, hold = 1.2, fi = 0.6, fo = 0.7) {
  const l = L[id]; if (!l) return 0;
  return Math.min(prog(t, l.start - 0.15, l.start - 0.15 + fi), 1 - prog(t, l.end + hold, l.end + hold + fo));
}
function lineText(t, id, x, y, size, color, opts = {}) {
  const a = vis(t, id, opts.hold ?? 1.2, opts.fi ?? 0.6, opts.fo ?? 0.7);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const rise = (1 - eout(prog(t, L[id].start - 0.15, L[id].start + 0.6))) * 18;
  (opts.serif ? sText : kText)(opts.text ?? L[id].text, x, y + rise, size, color, opts.align || 'center', opts.serif ? (opts.spacing ?? 0.18) : opts.weight ?? 0.045);
  ctx.restore();
}
function grain(t, a = 0.035) {
  const fr = Math.floor(t * 30);
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  for (let i = 0; i < 420; i++) ctx.fillRect(rnd(i + fr * 0.37) * W, rnd(i * 1.7 + fr) * H, 2, 2);
}
function vignette(a = 0.6) {
  const v = ctx.createRadialGradient(W / 2, H / 2, 420, W / 2, H / 2, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function knockImpact(t) { // 가장 최근 망치의 경과 시간
  let d = 99;
  for (const k of TL.knocks) if (t >= k) d = Math.min(d, t - k);
  return d;
}

// ---------- 나무 문 텍스처 (한 번만 그림) ----------
const DOOR_W = 1100, DOOR_H = 1180;
function makeLeaf(side) {
  const c = document.createElement('canvas'); c.width = DOOR_W / 2; c.height = DOOR_H;
  const g = c.getContext('2d');
  const planks = 4, pw = c.width / planks;
  for (let p = 0; p < planks; p++) {
    const base = 52 + rnd(p + side * 7) * 16;
    g.fillStyle = `rgb(${base + 22},${base},${base - 22})`; g.fillRect(p * pw, 0, pw, DOOR_H);
    for (let k = 0; k < 70; k++) {
      const x0 = p * pw + rnd(k * 3 + p * 101 + side) * pw;
      const sh = rnd(k + p * 13 + side * 3);
      g.strokeStyle = sh > 0.5 ? `rgba(20,10,4,${0.15 + sh * 0.25})` : `rgba(140,100,60,${0.06 + sh * 0.1})`;
      g.lineWidth = 1 + rnd(k * 7 + p) * 2.5; g.beginPath();
      for (let y = 0; y <= DOOR_H; y += 30) { const x = x0 + Math.sin(y / (90 + rnd(k) * 120) + k) * (4 + rnd(k + 9) * 8); y ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
    }
    // 옹이
    for (let k = 0; k < 2; k++) {
      const kx = p * pw + pw * (0.3 + rnd(p * 5 + k + side) * 0.4), ky = rnd(p * 9 + k * 3 + side) * DOOR_H;
      for (let r = 4; r < 30; r += 4) { g.strokeStyle = `rgba(25,12,5,${0.35 - r / 100})`; g.lineWidth = 2; g.beginPath(); g.ellipse(kx, ky, r * 0.6, r * 1.6, 0, 0, TAU); g.stroke(); }
    }
    g.fillStyle = 'rgba(10,5,2,.65)'; g.fillRect(p * pw - 2, 0, 4, DOOR_H);
  }
  // 쇠띠와 리벳
  for (const by of [170, DOOR_H / 2 - 40, DOOR_H - 230]) {
    g.fillStyle = '#211d1a'; g.fillRect(0, by, c.width, 46);
    g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(0, by, c.width, 5);
    for (let x = 30; x < c.width; x += 70) { g.fillStyle = '#3a3430'; g.beginPath(); g.arc(x, by + 23, 9, 0, TAU); g.fill(); g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.arc(x - 3, by + 20, 3, 0, TAU); g.fill(); }
  }
  // 문 가장자리 그림자
  const sg = g.createLinearGradient(side === 0 ? 0 : c.width, 0, side === 0 ? c.width : 0, 0);
  sg.addColorStop(0, 'rgba(0,0,0,.45)'); sg.addColorStop(0.15, 'rgba(0,0,0,0)'); sg.addColorStop(0.9, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,0,.5)');

}
const LEAF = [makeLeaf(0), makeLeaf(1)];
// open: 0 닫힘 → 1 활짝
function drawDoor(cx, top, s, open, t, light = 0) {
  ctx.save(); ctx.translate(cx, top); ctx.scale(s, s);
  // 문틀(돌)
  ctx.fillStyle = '#26231f'; ctx.fillRect(-DOOR_W / 2 - 90, -60, DOOR_W + 180, DOOR_H + 120);
  ctx.fillStyle = '#1a1816'; ctx.fillRect(-DOOR_W / 2 - 20, -20, DOOR_W + 40, DOOR_H + 40);
  // 문 너머의 빛
  if (open > 0) {
    const g = ctx.createRadialGradient(0, DOOR_H / 2, 50, 0, DOOR_H / 2, DOOR_W);
    g.addColorStop(0, '#fffaf0'); g.addColorStop(0.6, '#f6e7c4'); g.addColorStop(1, '#d9b56a');
    ctx.fillStyle = g; ctx.fillRect(-DOOR_W / 2, 0, DOOR_W, DOOR_H);
  }
  // 두 문짝 (원근: 열리며 폭이 줄고 바깥쪽이 커짐)
  for (const side of [0, 1]) {
    const dir = side === 0 ? -1 : 1;
    const ang = open * Math.PI * 0.46;
    const w = DOOR_W / 2 * Math.cos(ang);
    const hinge = dir * DOOR_W / 2;
    const grow = 1 + Math.sin(ang) * 0.18;
    ctx.save();
    ctx.translate(hinge, 0);
    // 경첩 쪽을 기준으로 안쪽 끝이 커지도록 단순 사다리꼴 근사
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-dir * w, -(grow - 1) * DOOR_H / 2); ctx.lineTo(-dir * w, DOOR_H + (grow - 1) * DOOR_H / 2); ctx.lineTo(0, DOOR_H); ctx.closePath();
    ctx.clip();
    ctx.drawImage(LEAF[side], side === 0 ? 0 : -w, -(grow - 1) * DOOR_H / 2, w, DOOR_H * grow);
    ctx.fillStyle = `rgba(0,0,0,${0.35 * Math.sin(ang)})`; ctx.fillRect(-W, -H, W * 2, H * 3);
    ctx.restore();
    // 고리 손잡이
    if (open < 0.3) {
      const hx = dir * 70 * Math.cos(ang);
      ctx.strokeStyle = '#4a423a'; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(hx, DOOR_H / 2 + 70, 34, 0, TAU); ctx.stroke();
      circle(hx, DOOR_H / 2 + 36, 14, '#3a3430');
    }
  }
  if (open <= 0) { ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(-3, 0, 6, DOOR_H); }
  ctx.restore();
}
// 측면 조명
function sideLight(a = 1) {
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, `rgba(0,0,0,${0.75 * a})`); g.addColorStop(0.35, 'rgba(0,0,0,.1)'); g.addColorStop(0.6, 'rgba(0,0,0,.15)'); g.addColorStop(1, `rgba(0,0,0,${0.85 * a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  glow(760, 380, 700, 'rgba(255,200,130,.18)', a);
}
// 망치 충격: 흔들림 + 빛 + 먼지
function impactFX(t, x, y) {
  const d = knockImpact(t);
  if (d > 1.2) return 0;
  glow(x, y, 260, 'rgba(255,220,160,.7)', Math.max(0, 1 - d / 0.25) * 0.7);
  for (let i = 0; i < 26; i++) {
    const p = d / 1.2;
    const px = x + (rnd(i) - 0.5) * 200 + (rnd(i + 3) - 0.5) * 60 * p, py = y + rnd(i + 5) * 40 + p * p * 420 * (0.5 + rnd(i + 7));
    circle(px, py, 1.5 + rnd(i + 9) * 2.5, `rgba(230,210,180,${0.6 * (1 - p)})`);
  }
  return d < 0.15 ? (1 - d / 0.15) * 7 : 0;
}

// ---------- 양피지 쪽지 ----------
function note(x, y, s, rot, latin, kr, sub, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  const w = 1000, h = 400;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rrect(-w / 2 + 14, -h / 2 + 18, w, h, 6); ctx.fill();
  const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); g.addColorStop(0, '#efe4cc'); g.addColorStop(1, '#d8c8a6');
  ctx.fillStyle = g; rrect(-w / 2, -h / 2, w, h, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(120,90,50,.35)'; ctx.lineWidth = 3; rrect(-w / 2 + 18, -h / 2 + 18, w - 36, h - 36, 4); ctx.stroke();
  sText(latin, 0, -78, 64, '#8a6418', 'center', 0.16);
  ctx.fillStyle = 'rgba(138,100,24,.6)'; ctx.fillRect(-60, -48, 120, 3);
  kText(kr, 0, 30, 74, C.ink, 'center', 0.05);
  kText(sub, 0, 128, 40, '#4b443a', 'center', 0.02);
  // 못
  circle(0, -h / 2 + 34, 13, '#2c2724'); circle(-3, -h / 2 + 31, 4, 'rgba(255,255,255,.35)');
  ctx.restore();
}

// ---------- 라인 아트 아이콘 (혼란 장면) ----------
function stroke(color, lw) { ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
const ICONS = {
  city() { stroke(C.ivory, 4); [[-300, 160, 120], [-170, 280, 100], [-50, 200, 110], [70, 340, 90], [170, 230, 120], [300, 150, 100]].forEach(([x, h, w]) => { ctx.strokeRect(x - w / 2, -h, w, h); for (let y = -h + 30; y < -10; y += 40) for (let k = -w / 2 + 20; k < w / 2 - 10; k += 30) ctx.strokeRect(x + k, y, 10, 14); }); ctx.beginPath(); ctx.moveTo(-420, 0); ctx.lineTo(420, 0); ctx.stroke(); },
  phone() { stroke(C.ivory, 4); rrect(-110, -220, 220, 400, 30); ctx.stroke(); ctx.fillStyle = 'rgba(214,165,58,.25)'; rrect(-90, -190, 180, 320, 10); ctx.fill(); for (let k = 0; k < 5; k++) { ctx.fillStyle = 'rgba(244,239,228,.6)'; ctx.fillRect(-70, -170 + k * 55, 140 - (k % 2) * 40, 18); } },
  ai() { stroke(C.gold, 3); const P = []; for (let i = 0; i < 14; i++) P.push([Math.cos(i * 2.4) * (80 + (i % 4) * 60), Math.sin(i * 2.4) * (60 + (i % 3) * 50)]); P.forEach((p, i) => P.forEach((q, j) => { if (j > i && (i + j) % 3 === 0) { ctx.beginPath(); ctx.moveTo(...p); ctx.lineTo(...q); ctx.stroke(); } })); P.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 9, 0, TAU); ctx.stroke(); }); },
  table() { stroke(C.ivory, 4); ctx.beginPath(); ctx.ellipse(0, 0, 330, 90, 0, 0, TAU); ctx.stroke(); [[-180, -10], [0, -30], [180, -10], [-80, 40], [100, 40]].forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(x, y, 50, 16, 0, 0, TAU); ctx.stroke(); }); ctx.beginPath(); ctx.moveTo(-250, 60); ctx.lineTo(-250, 220); ctx.moveTo(250, 60); ctx.lineTo(250, 220); ctx.stroke(); },
  pews() { stroke(C.ivory, 4); ctx.beginPath(); ctx.moveTo(-120, -60); ctx.lineTo(-120, -260); ctx.arc(0, -260, 120, Math.PI, 0); ctx.lineTo(120, -60); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -330); ctx.lineTo(0, -180); ctx.moveTo(-45, -280); ctx.lineTo(45, -280); ctx.stroke(); for (let r = 0; r < 4; r++) { const y = r * 60, w = 260 + r * 70; ctx.beginPath(); ctx.moveTo(-w, y); ctx.lineTo(-40, y); ctx.moveTo(40, y); ctx.lineTo(w, y); ctx.stroke(); } },
  hands() { stroke(C.ivory, 4); ctx.beginPath(); ctx.moveTo(-360, 120); ctx.quadraticCurveTo(-200, 60, -60, 10); for (let k = 0; k < 4; k++) { ctx.moveTo(-60, 10 - k * 18); ctx.lineTo(10 - k * 6, -10 - k * 22); } ctx.stroke(); stroke(C.goldL, 4); ctx.beginPath(); ctx.moveTo(320, 100); ctx.quadraticCurveTo(200, 60, 90, 20); for (let k = 0; k < 4; k++) { ctx.moveTo(90, 20 - k * 12); ctx.lineTo(40 + k * 4, 6 - k * 15); } ctx.stroke(); },
};
const ICON_SEQ = (() => {
  const keys = Object.keys(ICONS), out = []; let x = 2.2, i = 0;
  while (x < 27.5) { const dur = x < 8 ? 1.1 : x < 14 ? 0.55 : 0.9; out.push({ t0: x, t1: x + dur * 1.6, k: keys[i % keys.length], x: 300 + rnd(i * 3) * 1320, y: 300 + rnd(i * 5 + 1) * 520, s: 0.5 + rnd(i * 7) * 0.5 }); x += dur; i++; }
  return out;
})();
const WORDS = ['change', 'vite', 'mudando', 'cambiare', '빨리', 'scroll', 'AI', '어디로', 'où', 'news', '정신없어', 'para onde', 'faster', '불안', 'help', 'notification', '주님'];

// ================= 장면 =================
function sChaos(t) { // 0–30
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
  if (t >= 29.6) return;
  // 흩어지는 여러 언어의 단어
  WORDS.forEach((w, i) => {
    const a = prog(t, 2 + i * 0.6, 4 + i * 0.6) * (1 - prog(t, 27, 29.5));
    if (a <= 0) return;
    const x = (rnd(i) * W + t * (12 + rnd(i + 1) * 25) * (i % 2 ? 1 : -1) + W) % W, y = 140 + rnd(i + 2) * 800;
    ctx.save(); ctx.globalAlpha = a * (0.12 + 0.12 * Math.sin(t * 2 + i)); kText(w, x, y, 30 + rnd(i + 4) * 30, C.ivoryD, 'center', 0); ctx.restore();
  });
  // 빠르게 교차하는 이미지
  ICON_SEQ.forEach((ic, i) => {
    if (t < ic.t0 || t > ic.t1) return;
    const p = prog(t, ic.t0, ic.t1);
    const flick = rnd(Math.floor(t * 24) + i * 31) > 0.18 ? 1 : 0.2;
    const narrDim = 1 - 0.65 * Math.max(vis(t, 'c1', 1.5), vis(t, 'c2', 1.2), vis(t, 'c3', 1.5));
    ctx.save(); ctx.globalAlpha = Math.sin(p * Math.PI) * 0.55 * flick * narrDim;
    ctx.translate(ic.x + (rnd(Math.floor(t * 12) + i) - 0.5) * 10, ic.y); ctx.scale(ic.s * (1 + p * 0.08), ic.s * (1 + p * 0.08));
    ICONS[ic.k](); ctx.restore();
  });
  // 노이즈 바 (글리치)
  for (let k = 0; k < 4; k++) {
    if (rnd(Math.floor(t * 15) * 7 + k) > 0.8 && t > 2 && t < 28) {
      ctx.fillStyle = 'rgba(244,239,228,.05)'; ctx.fillRect(0, rnd(Math.floor(t * 15) + k * 3) * H, W, 4 + rnd(k + t) * 20);
    }

  lineText(t, 'c1', W / 2, 565, 76, C.ivory, { hold: 1.4 });
  lineText(t, 'c2', W / 2, 565, 76, C.ivory, { hold: 1.0 });
  lineText(t, 'c3', W / 2, 565, 76, C.ivory, { hold: 1.6, text: '무엇은 다시 개혁되어야 합니까?' });
  // 강조: '다시 개혁'
  const a3 = vis(t, 'c3', 1.6);
  if (a3 > 0) { ctx.save(); ctx.globalAlpha = a3 * prog(t, 25.0, 25.6); ctx.font = `76px ${KR}`; const full = ctx.measureText('무엇은 다시 개혁되어야 합니까?').width, pre = ctx.measureText('무엇은 ').width, seg = ctx.measureText('다시 개혁').width; kText('다시 개혁', W / 2 - full / 2 + pre, 565, 76, C.gold, 'left'); ctx.fillStyle = C.gold; ctx.fillRect(W / 2 - full / 2 + pre, 590, seg * prog(t, 25.0, 25.8), 4); ctx.restore(); }
}
function sKnock(t) { // 30–55
  ctx.fillStyle = '#0a0908'; ctx.fillRect(0, 0, W, H);
  const reveal = eio(prog(t, 30.0, 31.0));
  const z = 1.25 - (t - 30) * 0.004;

  ctx.save(); ctx.globalAlpha = reveal;
  const shake = knockImpact(t) < 0.15 ? (1 - knockImpact(t) / 0.15) * 7 : 0;
  ctx.translate((rnd(Math.floor(t * 60)) - 0.5) * shake, (rnd(Math.floor(t * 60) + 3) - 0.5) * shake);
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);

    ctx.save(); ctx.globalAlpha = a;
    glow(W / 2, 400, 420, 'rgba(214,165,58,.45)', 0.8);

    ctx.restore();

  if (band > 0) { const g = ctx.createLinearGradient(0, 640, 0, 1000); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.4, `rgba(0,0,0,${0.75 * band})`); g.addColorStop(1, `rgba(0,0,0,${0.75 * band})`); ctx.fillStyle = g; ctx.fillRect(0, 640, W, 440); }
  lineText(t, 'k2', W / 2, 820, 68, C.ivory, { hold: 2.0 });
  lineText(t, 'k3', W / 2, 790, 64, C.ivoryD, { hold: 4.6, fo: 0.8 });
  lineText(t, 'k4', W / 2, 890, 72, C.goldL, { hold: 2.8, fo: 0.8 });
